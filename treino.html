<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu treino</title>
<meta name="theme-color" content="#0B0C0E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Meu treino">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF1;--surface:#FFFFFF;--surface2:#F5F6F8;--ink:#15181C;--muted:#5D6570;--line:#D6DAE0;
  --accent:#E3A008;--accent-ink:#1D1500;--done:#23935A;--done-soft:#DDF2E6;--danger:#C2410C;--ok:#23935A;--warn:#D9480F;
  --peito:#D9480F;--costas:#1971C2;--biceps:#7048E8;--triceps:#C2255C;--ombro:#0C8599;--pernas:#5C940D;--core:#868E96;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E;--surface:#17191D;--surface2:#1F2227;--ink:#F1F1EE;--muted:#9AA1AA;--line:#2B2F35;
  --accent:#F4B321;--accent-ink:#1D1500;--done:#3BC47A;--done-soft:#163324;--danger:#FB923C;--ok:#3BC47A;--warn:#FB923C;
  --peito:#FF8A4C;--costas:#5AA9F0;--biceps:#A58BFF;--triceps:#F06595;--ombro:#3BC9DB;--pernas:#94D82D;--core:#ADB5BD;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0C0E;--surface:#17191D;--surface2:#1F2227;--ink:#F1F1EE;--muted:#9AA1AA;--line:#2B2F35;
  --accent:#F4B321;--accent-ink:#1D1500;--done:#3BC47A;--done-soft:#163324;--danger:#FB923C;--ok:#3BC47A;--warn:#FB923C;
  --peito:#FF8A4C;--costas:#5AA9F0;--biceps:#A58BFF;--triceps:#F06595;--ombro:#3BC9DB;--pernas:#94D82D;--core:#ADB5BD;
  color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 180px}
.display{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;letter-spacing:.01em}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 2px 14px}
header.top h1{margin:0;font-size:2.4rem;line-height:1;font-weight:800}
.sync{font-size:.8rem;color:var(--muted);text-align:right}
/* day plates */
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.day{position:relative;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.day .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.55rem;line-height:1}
.day .t{font-size:.62rem;color:var(--muted);margin-top:1px}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.sel .t{color:var(--accent-ink);opacity:.8}
.day .next{position:absolute;top:-4px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--done);border:2px solid var(--bg)}
.hero{margin:0 2px 16px}
.hero h2{margin:0;font-size:2.9rem;line-height:.95;font-weight:800}
.hero p{margin:6px 0 0;color:var(--muted)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.groups{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip b{width:8px;height:8px;border-radius:50%;display:inline-block}
/* exercises */
.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.ex.complete{border-color:var(--done)}
.exh{width:100%;display:flex;align-items:center;gap:11px;padding:12px;background:none;border:0;text-align:left}
.ring{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1rem;border:3px solid var(--line);color:var(--muted)}
.ex.complete .ring{border-color:var(--done);background:var(--done);color:#fff}
.ex.partial .ring{border-color:var(--accent);color:var(--ink)}
.exh .info{flex:1;min-width:0}
.thumb{flex:none;width:68px;height:62px;border-radius:12px;background:var(--surface2);overflow:hidden}
.thumb svg,.big svg{display:block;width:100%;height:100%}
.big{background:var(--surface2);border-radius:12px;aspect-ratio:160/136;max-height:260px;margin:0 auto 12px;width:100%}
.exh .name{font-weight:600;font-size:1.05rem;line-height:1.2}
.exh .meta{font-size:.88rem;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.exh .grp{display:inline-flex;align-items:center;gap:5px}
.exh .grp b{width:8px;height:8px;border-radius:50%}
.tag{font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.chev{flex:none;width:22px;height:22px;color:var(--muted);transition:transform .2s}
.ex.open .chev{transform:rotate(180deg)}
.exb{padding:0 14px 16px;display:none}
.ex.open .exb{display:block}
.how{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.how ol{margin:0;padding-left:20px}
.how li{margin:3px 0}
.how .vid{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--accent)}
details.how summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.95rem}
details.how summary::-webkit-details-marker{display:none}
details.how .sch{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .2s}
details.how[open] .sch{transform:rotate(180deg)}
details.how ol{margin-top:8px}
.how .dt{margin:10px 0 2px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.how .dicas{margin:0;padding-left:20px;font-size:.9rem}
.how .dicas li{margin:2px 0}
.mrow{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.mrow .chip{color:var(--ink)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center}
.set .sn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;color:var(--muted);text-align:center}
.fld{position:relative}
.fld input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 34px 0 12px;font-size:1.15rem;font-weight:600}
.fld span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:.8rem;color:var(--muted);pointer-events:none}
.chk{height:48px;border-radius:12px;border:2px solid var(--line);background:none;display:flex;align-items:center;justify-content:center}
.chk svg{width:22px;height:22px;opacity:.35}
.set.done .chk{background:var(--done);border-color:var(--done);color:#fff}
.set.done .chk svg{opacity:1}
.set.done input{background:var(--done-soft);border-color:transparent}
.hint{font-size:.82rem;color:var(--muted);margin-top:10px}
.prog{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--done-soft);color:var(--ink);font-size:.9rem}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.restrow{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.restrow b{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;color:var(--ink);min-width:44px;text-align:center}
.restrow button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1.2rem;font-weight:700}
.swapbtn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:.88rem}
.swap{margin-top:10px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.swap p{margin:0 0 8px;font-size:.88rem;color:var(--muted)}
.swap button{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.loads details summary{display:flex;justify-content:space-between;padding:11px 14px;cursor:pointer;list-style:none}
.loads details summary::-webkit-details-marker{display:none}
.loads details{border-top:1px solid var(--line)}
.loads details:first-child{border-top:0}
.chart{display:block;width:100%;height:auto;padding:0 10px 10px}
.loads .empty{padding:0 14px 12px;font-size:.85rem}
.actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.btn{height:54px;border-radius:16px;border:0;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);height:46px;font-weight:600;font-size:.95rem}
.rest{margin:28px 2px;text-align:center;color:var(--muted)}
/* history */
.sec{margin:26px 2px 10px;font-size:1.5rem;font-weight:800}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.hist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.hist .d1{font-weight:600}
.hist .d2{font-size:.85rem;color:var(--muted)}
.hist .kg{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.6rem;line-height:1}
.hist ul{margin:12px 0 0;padding:0;list-style:none;font-size:.92rem}
.hist li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.hist li span:last-child{color:var(--muted);text-align:right}
.loads{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.loads b{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem}
.empty{color:var(--muted);padding:6px 2px}
/* timer + tabs */
.timer{position:fixed;left:50%;transform:translate(-50%,140%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(588px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:20;transition:transform .25s}
.timer{visibility:hidden}.timer.on{transform:translate(-50%,0);visibility:visible}
.timer .tt{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2.1rem;line-height:1;min-width:84px}
.timer .tl{flex:1;min-width:0;font-size:.85rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:0;border-radius:10px;height:38px;padding:0 12px;font-weight:600;background:rgba(127,127,127,.25);color:inherit}
.timer.end{background:var(--done);color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
nav.tabs div{display:flex;width:100%;max-width:620px}
nav.tabs button{flex:1;height:62px;border:0;background:none;color:var(--muted);font-weight:600;font-size:.85rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
.days.d7 .day .n{font-size:1.2rem}.days.d7 .day .t{font-size:.55rem}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.pcard h4{margin:0;font-size:1.05rem}.pcard .d2{font-size:.85rem;color:var(--muted);margin:4px 0 0;overflow-wrap:anywhere}
.prow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.prow .btn{height:40px;padding:0 14px;font-size:.92rem;border-radius:12px}
.prow .btn.ghost{height:40px}
.bday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.bday .lbl{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bday .lbl input,.bname{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-weight:600;min-width:0}
.bname{width:100%}
.bex{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bex .nm{flex:1 1 100%;font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:6px}
.bex .nm b{width:8px;height:8px;border-radius:50%;flex:none}
.bex .rp{width:86px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 8px}
.bex .ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.bex .tg{height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:.82rem;font-weight:600}
.bex .tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bex .restrow{gap:4px}
.picker .swap h5{margin:8px 0 2px;font-size:.85rem;display:flex;align-items:center;gap:6px}
nav.tabs button.sel{color:var(--ink)}
nav.tabs button.sel svg{color:var(--accent)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--done);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;transition:transform .25s}
.toast.on{transform:translate(-50%,0)}
.cta{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 16px;margin-bottom:18px;animation:ctaIn .5s ease-out both}
.cta h2{margin:0;font-size:2.3rem;line-height:.95;font-weight:800}
.cta p{margin:6px 0 0;color:var(--muted)}
.cta .btn{width:100%;margin-top:16px;animation:ctaPulse 2s ease-in-out infinite}
@keyframes ctaIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ctaPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent);transform:scale(1)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 0%,transparent);transform:scale(1.015)}}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.tile .k{font-size:.8rem;color:var(--muted)}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.9rem;line-height:1.05;overflow-wrap:anywhere}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile .up{color:var(--done);font-weight:600}.tile .dn{color:var(--danger);font-weight:600}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;margin-bottom:10px}
.gcard h4{margin:0 10px 6px;font-size:1rem}
.gcard .hint{margin:4px 10px 0}
.gcard .groups{margin:0 10px 8px}
.gcard .chip{border:0;cursor:pointer}
.gcard .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.gcard details{margin:6px 10px 0;font-size:.85rem;color:var(--muted)}
.gcard table{width:100%;border-collapse:collapse;margin-top:4px}.gcard td{padding:2px 0;border-top:1px solid var(--line)}.gcard td:last-child{text-align:right}
.bkcard .prow .btn{flex:1 1 150px}
.bkpaste{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bkpaste textarea{display:block;width:100%;min-height:150px;box-sizing:border-box;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:10px 12px;font:500 .85rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;overflow-wrap:anywhere}
.bkpaste textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
/* calorias */
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.ksum{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.ksum .kn{flex:1 1 170px;min-width:0}
.ksum .km{flex:0 1 110px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding-top:4px}
.ksum .km svg{width:92px;height:auto;display:block}
.ksum .km .st{font-weight:700;font-size:.88rem;line-height:1.15}
.ksum .km .fr{font-size:.76rem;color:var(--muted);line-height:1.25}
.krow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:.95rem}
.krow:first-child{border-top:0}
.krow b{font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;font-weight:700;white-space:nowrap}
.krow .d2{font-size:.78rem;color:var(--muted)}
.saldo{margin-top:8px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.7rem;line-height:1.05}
.saldo.ok{color:var(--ok)}.saldo.warn{color:var(--warn)}
.kbar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:10px}
.kbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.kbar i.over{background:var(--warn)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 12px}
.daynav>button{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:700}
.daynav>button:disabled{opacity:.35;cursor:default}
.daynav .dl{flex:1;min-width:0;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.6rem;line-height:1.05}
.daynav .today{height:28px;padding:0 10px;margin-top:4px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font:600 .78rem Barlow,system-ui,sans-serif;color:var(--muted)}
.ffrm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ffrm .full{grid-column:1/-1}
.ffrm input,.pf input,.pf select{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-weight:600;min-width:0}
.ffrm .fld input{padding-right:40px}
.ffrm .btn{height:46px;border-radius:12px;font-size:.95rem}
.sugg{display:flex;flex-direction:column;gap:4px;grid-column:1/-1}
.sugg:empty{display:none}
.sugg button{text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;justify-content:space-between;gap:8px;font-weight:500}
.sugg button span:last-child{color:var(--muted);font-size:.85rem;white-space:nowrap}
.rchips{margin:8px 0 2px}
.rchips .chip{border:0;cursor:pointer;padding:5px 11px;color:var(--ink)}
.flist{margin:4px 0 0;padding:0;list-style:none}
.flist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.flist li:first-child{border-top:0}
.flist li .fn{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.flist li .fq{font-size:.82rem;color:var(--muted)}
.flist li .fk{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;white-space:nowrap}
.flist li button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;flex:none}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:12px}
.pf label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.pf label.full{grid-column:1/-1}
.pf .help{grid-column:1/-1;font-size:.8rem;color:var(--muted);margin:0}
.pcard summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard summary::-webkit-details-marker{display:none}
.pcard summary .d2{margin:0;text-align:right}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink);font-size:.9rem}
.mascote .breathe{transform-origin:50px 112px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.cta,.cta .btn,.mascote .breathe{animation:none!important}}

<body>

<script>
/* ===== Ilustrações animadas =====
   Boneco em SVG (viewBox 160x136) montado a cada quadro a partir de poses. Para cada exercício, FIG guarda a pose
   inicial A (músculo alongado) e a pose de pico B (músculo contraído); figSVG(id,k) interpola as duas conforme a fase
   do ciclo (concêntrica 1 s, pausa 0,3 s, excêntrica 1,6 s, pausa 0,4 s), desenha o corpo com volume, o equipamento,
   a região do músculo trabalhado (opacidade acompanha a contração) e as marcações de postura. */
const FL=130;                                   /* linha do chão */
const R=Math.PI/180;
const dir=a=>[Math.sin(a*R),Math.cos(a*R)];     /* 180 = para cima, 90 = para a direita */
const add=(p,v,s=1)=>[p[0]+v[0]*s,p[1]+v[1]*s];
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
const lerp=(a,b,k)=>a+(b-a)*k;
const mix=(p,q,k)=>[lerp(p[0],q[0],k),lerp(p[1],q[1],k)];
const nrm=v=>{const d=Math.hypot(v[0],v[1])||1;return [v[0]/d,v[1]/d];};
const f1=n=>String(Math.round(n*10)/10);
const angOf=(p,q)=>Math.atan2(q[1]-p[1],q[0]-p[0])/R;
/* Cinemática inversa de dois segmentos: devolve [articulação do meio, extremidade] */
function ik(S,T,l1,l2,bend){
  let dx=T[0]-S[0],dy=T[1]-S[1];let d=Math.hypot(dx,dy)||0.001;
  const ux=dx/d,uy=dy/d;
  d=Math.min(Math.max(d,Math.abs(l1-l2)+0.5),l1+l2-0.3);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const E=[S[0]+ux*a-uy*h*bend,S[1]+uy*a+ux*h*bend];
  return [E,[S[0]+ux*d,S[1]+uy*d]];
}
function lerpPose(A,B,k){
  const o={};
  for(const key in A){
    const a=A[key],b=B[key]===undefined?a:B[key];
    if(Array.isArray(a))o[key]=a.map((v,i)=>typeof v==="number"?lerp(v,b[i],k):v);
    else if(typeof a==="number")o[key]=lerp(a,b,k);
    else o[key]=a;
  }
  return o;
}
/* Fases do ciclo de 3,3 s. Devolve e (0 alongado → 1 pico), m (intensidade do músculo), w (força da seta de esforço) */
const CYCLE_MS=3300,KPEAK=1.15/3.3;
const sm=x=>x*x*(3-2*x);
function phase(k){
  const t=(((k%1)+1)%1)*3.3;
  if(t<1){const e=sm(t);return {e,m:.25+.75*e,w:Math.sin(Math.PI*e)};}
  if(t<1.3)return {e:1,m:1,w:0};
  if(t<2.9){const e=1-sm((t-1.3)/1.6);return {e,m:.25+.55*e,w:0};}
  return {e:0,m:.25,w:0};
}
/* Primitivas */
const C=(p,r,c,extra="")=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${c}"${extra}/>`;
const L=(p,q,w,c,extra="")=>`<line x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(q[0])}" y2="${f1(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${extra}/>`;
/* Segmento com volume: cápsula que afina de w1 (em p) para w2 (em q) */
function cap(p,q,w1,w2,c){
  const [ux,uy]=nrm(sub(q,p));const nx=-uy,ny=ux,a=w1/2,b=w2/2;
  return `<path d="M${f1(p[0]+nx*a)} ${f1(p[1]+ny*a)}L${f1(q[0]+nx*b)} ${f1(q[1]+ny*b)}A${b} ${b} 0 0 0 ${f1(q[0]-nx*b)} ${f1(q[1]-ny*b)}L${f1(p[0]-nx*a)} ${f1(p[1]-ny*a)}A${a} ${a} 0 0 0 ${f1(p[0]+nx*a)} ${f1(p[1]+ny*a)}Z" fill="${c}"/>`;
}
/* Normal "da frente" do segmento p→q: a perpendicular que aponta para o lado de F (direção do peito) */
function fnorm(p,q,F){const u=nrm(sub(q,p));let n=[-u[1],u[0]];if(n[0]*F[0]+n[1]*F[1]<0)n=[-n[0],-n[1]];return n;}
/* Elipse de músculo alinhada ao segmento p→q: fr = fração ao longo, off = deslocamento para a frente (negativo = costas),
   rx = meio-comprimento ao longo, ry = meia-largura */
function blob(p,q,fr,off,rx,ry,F){
  const u=nrm(sub(q,p)),n=fnorm(p,q,F);
  const c=add(add(p,u,Math.hypot(q[0]-p[0],q[1]-p[1])*fr),n,off);
  return `<ellipse cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${rx}" ry="${ry}" transform="rotate(${f1(angOf(p,q))} ${f1(c[0])} ${f1(c[1])})"/>`;
}
const ci=(c,r)=>`<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="${r}"/>`;
/* Cargas. db = halter visto de ponta (anilha), dbh = halter de perfil girando com o antebraço (pegada neutra),
   dbu = halter na vertical, bar = barra de ponta, grip = pegador da polia, rope = corda */
function weight(p,kind,ang=0){
  const A="var(--accent)",M="var(--muted)";
  if(!kind)return "";
  if(kind==="db")return C(p,5.2,A)+C(p,3.4,"var(--surface)",' opacity=".35"')+C(p,1.5,M);
  if(kind==="dbh"||kind==="dbu")return `<g transform="translate(${f1(p[0])} ${f1(p[1])}) rotate(${f1(kind==="dbu"?90:ang+90)})"><rect x="-7" y="-1.3" width="14" height="2.6" rx="1.3" fill="${M}"/><rect x="-8.6" y="-5.2" width="4.2" height="10.4" rx="1.3" fill="${A}"/><rect x="4.4" y="-5.2" width="4.2" height="10.4" rx="1.3" fill="${A}"/><rect x="-5.2" y="-3.6" width="1.4" height="7.2" rx=".7" fill="${A}" opacity=".55"/><rect x="3.8" y="-3.6" width="1.4" height="7.2" rx=".7" fill="${A}" opacity=".55"/></g>`;
  if(kind==="bar")return `<rect x="${f1(p[0]-3.2)}" y="${f1(p[1]-2.2)}" width="6.4" height="4.4" rx="2.2" fill="${M}"/>`;
  if(kind==="grip")return C(p,2.7,M);
  if(kind==="rope")return C(p,2.4,M)+`<path d="M${f1(p[0]-1.5)} ${f1(p[1]+1)}l-3.5 7M${f1(p[0]+1.5)} ${f1(p[1]+1)}l3.5 7" stroke="${M}" stroke-width="2.2" stroke-linecap="round" fill="none"/>`+C([p[0]-5.2,p[1]+8.6],1.9,A)+C([p[0]+5.2,p[1]+8.6],1.9,A);
  return "";
}
/* Equipamentos */
const LN="var(--line)",MU="var(--muted)";
const padLine=(p,q,w)=>L(p,q,w+2,MU,' stroke-opacity=".4"')+L(p,q,w,LN);
const EQ={
  floor:`<line x1="4" y1="${FL+1.5}" x2="156" y2="${FL+1.5}" stroke="${LN}" stroke-width="3" stroke-linecap="round"/>`,
  pad:(x1,x2,y,h=6)=>`<rect x="${x1}" y="${y}" width="${x2-x1}" height="${h}" rx="${h/2}" fill="${LN}" stroke="${MU}" stroke-opacity=".4"/>`,
  flat:(x1,x2,y)=>`<path d="M${x1+9} ${y+5}V${FL}M${x2-9} ${y+5}V${FL}M${x1+3} ${FL}h12M${x2-15} ${FL}h12" stroke="${MU}" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" fill="none"/>`+EQ.pad(x1,x2,y),
  seat:(x1,x2,y)=>`<path d="M${(x1+x2)/2} ${y+5}V${FL}M${(x1+x2)/2-9} ${FL}h18" stroke="${MU}" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" fill="none"/>`+EQ.pad(x1,x2,y),
  back:(p,q)=>padLine(p,q,7),
  tower:(x,top=4)=>`<rect x="${x}" y="${top}" width="9" height="${FL-top}" rx="2" fill="${LN}" stroke="${MU}" stroke-opacity=".4"/>`,
  pulley:(x,y)=>`<circle cx="${x}" cy="${y}" r="3.6" fill="${LN}" stroke="${MU}" stroke-width="1.6"/>`,
  /* coluna de pesos: as placas de cima sobem "lift" quando o cabo é puxado; devolve o desenho e o ponto onde o cabo prende */
  stack:(x,lift)=>{let s="";for(let i=0;i<4;i++)s+=`<rect x="${x}" y="${FL-6-i*4.5}" width="16" height="4" rx="1" fill="${MU}" opacity=".5"/>`;const y0=FL-6-4*4.5-lift;for(let i=0;i<3;i++)s+=`<rect x="${x}" y="${f1(y0-i*4.5)}" width="16" height="4" rx="1" fill="${MU}"/>`;s+=`<rect x="${x+7}" y="${f1(y0-9-5)}" width="2" height="15" fill="${MU}"/>`;return {s,top:[x+8,y0-14]};},
  cable:pts=>`<polyline points="${pts.map(p=>f1(p[0])+","+f1(p[1])).join(" ")}" fill="none" stroke="${MU}" stroke-width="1.4" stroke-linejoin="round"/>`
};
/* Vista lateral. Pose: hip, t (ângulo do tronco), hd (cabeça), F (direção do peito), foot/fb, foot2/fb2 (perna de trás),
   knee/knee2 (joelho explícito), hand/hb ou elb+fa (cotovelo fixo e ângulo do antebraço), hand2/hb2, ft (comprimento do pé) */
function jointsSide(P){
  const F=P.F||[1,0];
  const S=add(P.hip,dir(P.t),34);
  const nd=dir(P.t+(P.hd||0));
  const J={S,hip:P.hip,F,neck:add(S,nd,5),head:add(S,nd,13),ft:P.ft===undefined?9:P.ft};
  const res=h=>h?(h[0]==="r"?[S[0]+h[1],S[1]+h[2]]:h[0]==="hip"?[P.hip[0]+h[1],P.hip[1]+h[2]]:h):null;
  const leg=(Ft,b,K0)=>K0?[K0,Ft]:ik(P.hip,Ft,26,25,b);
  [J.K,J.A]=leg(P.foot,P.fb===undefined?-1:P.fb,P.knee);
  if(P.foot2)[J.K2,J.A2]=leg(P.foot2,P.fb2===undefined?-1:P.fb2,P.knee2);
  let T=res(P.hand);const EL=P.elb?res(P.elb):null;
  if(P.fa!==undefined&&EL)T=add(EL,dir(P.fa),17);
  [J.E,J.H]=EL?[EL,T]:ik(S,T,20,17,P.hb===undefined?1:P.hb);
  if(P.elb2&&P.fa2!==undefined){J.E2=res(P.elb2);J.H2=add(J.E2,dir(P.fa2),17);}
  else if(P.hand2)[J.E2,J.H2]=ik(S,res(P.hand2),20,17,P.hb2===undefined?1:P.hb2);
  return J;
}
function bodySide(P,J,f){
  const ink="var(--ink)",back="var(--muted)";
  const legS=(K,A,c)=>cap(P.hip,K,10,8,c)+cap(K,A,8,5.5,c)+cap(A,[A[0]+J.ft,A[1]+.5],5.5,4,c);
  const armS=(E,H,c)=>cap(J.S,E,7,5.5,c)+cap(E,H,5.5,4.2,c)+C(H,2.8,c);
  let s="";
  if(J.K2)s+=legS(J.K2,J.A2,back);
  if(J.H2)s+=armS(J.E2,J.H2,back)+weight(add(J.H2,f.wo2||f.wo||[0,0]),f.hold2||"",angOf(J.E2,J.H2));
  const fr=fnorm(P.hip,J.S,J.F),c1=add(mix(P.hip,J.S,.5),fr,2);     /* tronco com leve curvatura, peito aberto */
  s+=`<path d="M${f1(P.hip[0])} ${f1(P.hip[1])}Q${f1(c1[0])} ${f1(c1[1])} ${f1(J.S[0])} ${f1(J.S[1])}" stroke="${ink}" stroke-width="12.5" stroke-linecap="round" fill="none"/>`+C(P.hip,6.6,ink);
  s+=cap(J.S,J.neck,5.5,4.6,ink)+C(J.head,7.2,ink);
  s+=legS(J.K,J.A,ink)+armS(J.E,J.H,ink);
  return s;
}
/* Regiões musculares na vista lateral */
function muscSide(n,J){
  const {S,hip,F,E,H,K,A}=J;
  switch(n){
    case "peito":return blob(hip,S,.8,4.5,7,4,F);
    case "dorsal":return blob(hip,S,.55,-3.5,12,4,F);
    case "trapezio":return blob(hip,S,.98,-4,4,3,F);
    case "lombar":return blob(hip,S,.25,-4,7,3,F);
    case "core":return blob(hip,S,.42,4.5,9,3.2,F);
    case "ombro_ant":return ci(add(S,fnorm(hip,S,F),2.5),5.2);
    case "ombro_lat":return ci(S,5.6);
    case "ombro_post":return ci(add(S,fnorm(hip,S,F),-2.5),5.2);
    case "biceps":return blob(S,E,.5,2.6,7,3.2,F);
    case "triceps":return blob(S,E,.5,-2.6,7,3,F);
    case "antebraco":return blob(E,H,.4,0,6,2.8,F);
    case "gluteo":return ci(add(add(hip,fnorm(hip,S,F),-4.5),nrm(sub(K,hip)),3),6);
    case "quad":return blob(hip,K,.5,3,9,3.6,F);
    case "posterior":return blob(hip,K,.5,-3,9,3.6,F);
    case "pant":return blob(K,A,.4,-2.6,7,3,F);
  }
  return "";
}
/* Vista frontal. Pose: mode (stand, seat, bent, lie), sy (altura do ombro), hand [dx,y] relativo ao eixo, hb, ou arc (ângulo do braço) */
function jointsFront(P){
  const cx=80,sy=P.sy,mode=P.mode||"stand",sx=mode==="lie"?14:13;
  const J={cx,sy,mode,sx,hy:sy+34,Sh:[cx+sx,sy]};
  if(P.arc!==undefined){const a=P.arc*R,b=(P.arc-14)*R;J.E=[cx+sx+20*Math.sin(a),sy-20*Math.cos(a)];J.H=[J.E[0]+17*Math.sin(b),J.E[1]-17*Math.cos(b)];}
  else [J.E,J.H]=ik(J.Sh,[cx+P.hand[0],P.hand[1]],20,17,P.hb===undefined?1:P.hb);
  return J;
}
const mirX=(p,cx)=>[2*cx-p[0],p[1]];
function bodyFront(P,J){
  const ink="var(--ink)",{cx,sy,mode,hy}=J;let s="";
  if(mode==="lie"){
    s+=C([cx,sy-8],6.8,ink)+`<ellipse cx="${cx}" cy="${sy+2}" rx="17" ry="7" fill="${ink}"/>`;
  }else if(mode==="bent"){
    const h2=sy+8;
    s+=cap([cx-7,h2],[cx-9,FL-3],9,6.5,ink)+cap([cx+7,h2],[cx+9,FL-3],9,6.5,ink);
    s+=`<ellipse cx="${cx-9}" cy="${FL-1.5}" rx="5" ry="2.5" fill="${ink}"/><ellipse cx="${cx+9}" cy="${FL-1.5}" rx="5" ry="2.5" fill="${ink}"/>`;
    s+=`<rect x="${cx-15}" y="${sy-4}" width="30" height="13" rx="6.5" fill="${ink}"/>`+C([cx,sy+12],7.2,ink);
  }else{
    if(mode==="seat")s+=cap([cx-7,hy],[cx-11,hy+7],10,9,ink)+cap([cx+7,hy],[cx+11,hy+7],10,9,ink)+cap([cx-11,hy+7],[cx-12,FL-3],8,5.5,ink)+cap([cx+11,hy+7],[cx+12,FL-3],8,5.5,ink);
    else s+=cap([cx-7,hy],[cx-9,FL-3],9.5,6,ink)+cap([cx+7,hy],[cx+9,FL-3],9.5,6,ink);
    s+=`<ellipse cx="${cx-10}" cy="${FL-1.5}" rx="5.5" ry="2.5" fill="${ink}"/><ellipse cx="${cx+10}" cy="${FL-1.5}" rx="5.5" ry="2.5" fill="${ink}"/>`;
    s+=`<path d="M${cx-14} ${sy-2}L${cx+14} ${sy-2}L${cx+9} ${hy+2}L${cx-9} ${hy+2}Z" fill="${ink}" stroke="${ink}" stroke-width="5" stroke-linejoin="round"/>`;
    s+=cap([cx,sy-3],[cx,sy-9],5.5,4.6,ink)+C([cx,sy-15.5],7.2,ink);
  }
  for(const m of [1,-1]){
    const Sh=m>0?J.Sh:mirX(J.Sh,cx),E=m>0?J.E:mirX(J.E,cx),H=m>0?J.H:mirX(J.H,cx);
    s+=cap(Sh,E,7,5.5,ink)+cap(E,H,5.5,4.2,ink)+C(H,2.8,ink);
  }
  return s;
}
function muscFront(n,J){
  const {cx,sy,mode}=J,F=[0,-1],Sh=J.Sh,ShL=mirX(J.Sh,cx),EL=mirX(J.E,cx),HL=mirX(J.H,cx);
  const both=f=>f(1)+f(-1);
  switch(n){
    case "peito":return mode==="lie"?both(m=>ci([cx+m*7,sy],4.6)):both(m=>`<ellipse cx="${cx+m*6.5}" cy="${sy+7}" rx="6" ry="4.4" transform="rotate(${m*-12} ${cx+m*6.5} ${sy+7})"/>`);
    case "ombro_ant":case "ombro_lat":case "ombro_post":return both(m=>ci([cx+m*J.sx,sy+(mode==="bent"?-1:0)],5.5));
    case "trapezio":return both(m=>`<ellipse cx="${cx+m*7}" cy="${sy-4.5}" rx="5" ry="2.6"/>`);
    case "core":return `<ellipse cx="${cx}" cy="${sy+22}" rx="5" ry="8"/>`;
    case "dorsal":return both(m=>`<ellipse cx="${cx+m*11}" cy="${sy+13}" rx="3" ry="8"/>`);
    case "biceps":return blob(Sh,J.E,.5,0,7,3.2,F)+blob(ShL,EL,.5,0,7,3.2,F);
    case "triceps":return blob(Sh,J.E,.5,2.4,7,3,[1,0])+blob(ShL,EL,.5,2.4,7,3,[-1,0]);
    case "antebraco":return blob(J.E,J.H,.4,0,6,2.8,F)+blob(EL,HL,.4,0,6,2.8,F);
    case "quad":return mode==="stand"?both(m=>`<ellipse cx="${cx+m*8}" cy="${sy+50}" rx="3.6" ry="9"/>`):"";
  }
  return "";
}
/* Marcações de postura: anel pulsante na articulação fixa, linha tracejada da coluna neutra e seta do esforço */
function markers(f,J,P,ph,k,front){
  let s="";const A="var(--accent)";
  if(f.ring&&J[f.ring]){const p=J[f.ring],pu=(1+Math.sin(k*Math.PI*8))/2;s+=`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${f1(6.4+1.8*pu)}" fill="none" stroke="${A}" stroke-width="1.5" stroke-opacity="${f1(.45+.45*pu)}"/>`;}
  if(f.spine&&!front){const u=nrm(sub(J.S,P.hip)),bk=fnorm(P.hip,J.S,J.F).map(v=>-v);const a=add(add(P.hip,u,-7),bk,10),b=add(add(J.head,u,3),bk,10);s+=L(a,b,1.4,"var(--ok)",' stroke-dasharray="3 3" opacity=".9"');}
  if(ph.w>.02&&f.arrow!==false){
    const j=front?"H":(f.arrow||"H"),p1=J[j];

function normState(){state.rest=state.rest||{};state.swaps=state.swaps||{};state.lastReps=state.lastReps||{};state.weights=state.weights||{};if(!Array.isArray(state.programs))state.programs=[];if(!state.activeProgram)state.activeProgram="fullbody6";if(state.draft===undefined)state.draft=null;

function findProg(id){return PRESETS.find(p=>p.id===id)||state.programs.find(p=>p.id===id)||null;}
function applyProgram(){
  let p=findProg(state.activeProgram);
  if(!p||!Array.isArray(p.days)||!p.days.length){state.activeProgram="fullbody6";p=PRESETS[0];}
  DAYS=p.days;
  if(state.session&&state.session.prog&&state.session.prog!==state.activeProgram)state.session=null;
  if(state.session&&(state.session.day<1||state.session.day>DAYS.length))state.session=null;
  if(ui.day!=null&&ui.day>DAYS.length)ui.day=null;
}
function swapKey(day,i){return state.activeProgram==="fullbody6"?day+"#"+i:state.activeProgram+":"+day+"#"+i;}

let saveT=null,writing=false,pending=false;

async function push(){
  if(!docRef)return;
  if(writing){pending=true;return;}

}
function setSync(){const el=$("#sync");if(el)el.textContent=cloud?"Salvo na sua conta":"Salvo neste aparelho";}

function sess(day){
  if(!state.session||state.session.day!==day)return null;
  return state.session;
}
function setsOf(day,id,i){
  const s=sess(day);const key=id+"#"+i;
  return (s&&s.sets[key])||null;
}
function ensureSession(day){
  if(!state.session||state.session.day!==day){
    state.session={day,prog:state.activeProgram,startedAt:Date.now(),sets:{}};
  }
  return state.session;
}
function item(day,i){const it=DAYS[day-1].items[i];const sw=state.swaps[swapKey(day,i)];return sw&&EX[sw]?{...it,id:sw}:it;}
function restOf(it){const r=state.rest[it.id];return r!=null?r:(it.m?150:75);}
function fmtT(sec){return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");}
function topReps(r){const m=String(r).match(/\d+/g);return m?Math.max(...m.map(Number)):null;}
function stepFor(id){const f=FIG[id];if(!f||!f.hold)return 0;return f.hold.startsWith("db")?2:5;}
function exProgress(day,it,i){
  const arr=setsOf(day,it.id,i)||[];
  return arr.filter(x=>x&&x.done).length;
}

  <p>${day===nd?(state.session?"Treino em andamento":"Seu próximo treino"):"Dia "+nd+" é o seu próximo treino"}. ${plan.items.length} exercícios, cerca de ${mins} min.</p>
  <div class="groups">${groups.map(g=>`<span class="chip"><b style="background:var(--${g})"></b>${G[g]}</span>`).join("")}</div>
  <div class="bar" aria-label="Séries concluídas"><i style="width:${total?done/total*100:0}%"></i></div>
  <p style="margin-top:6px;font-size:.88rem">${done} de ${total} séries feitas</p></section>

   ${sess(day)&&done?'<button class="btn ghost" id="reset" type="button">Descartar séries deste treino</button>':""}
   ${other?`<p class="hint">Você tem o Dia ${state.session.day} em andamento. Marcar séries aqui substitui aquele treino.</p>`:""}
  </div>`;
  h+=backupHTML();

function chartSVG(pts,label,fmt,emptyMsg){

  if(!pts||pts.length<2)return `<p class="empty">${esc(emptyMsg||"O gráfico aparece a partir do segundo registro.")}</p>`;
  const last=pts.slice(-16);const vs=last.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx===mn){mx+=1;mn-=1;}
  const W=300,H=90,px=i=>14+i*(W-28)/(last.length-1),py=v=>H-14-(v-mn)/(mx-mn)*(H-28);
  const path=last.map((p,i)=>(i?"L":"M")+px(i).toFixed(1)+" "+py(p.v).toFixed(1)).join(" ");
  const dots=last.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(p.v).toFixed(1)}" r="3.5" fill="var(--accent)"><title>${esc(dShort(p.d))}: ${esc(fmt(p.v))}</title></circle>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||"")}"><text x="2" y="${py(mx)+4}" font-size="9" fill="var(--muted)">${esc(fmt(mx))}</text><text x="2" y="${py(mn)+4}" font-size="9" fill="var(--muted)">${esc(fmt(mn))}</text><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="14" y="${H-2}" font-size="9" fill="var(--muted)">${dShort(last[0].d)}</text><text x="${W-14}" y="${H-2}" font-size="9" text-anchor="end" fill="var(--muted)">${dShort(last[last.length-1].d)}</text></svg>`;
}

function barsSVG(vals,labels,fmt,label,goal){
  const W=320,H=130,top=16,bot=22,left=8,n=vals.length;
  let mx=Math.max(...vals,goal||0,1);
  const bw=(W-left*2)/n,ys=v=>H-bot-(v/mx)*(H-bot-top);
  let g=`<line x1="${left}" y1="${H-bot}" x2="${W-left}" y2="${H-bot}" stroke="var(--line)" stroke-width="1"/>`;
  if(goal)g+=`<line x1="${left}" y1="${ys(goal).toFixed(1)}" x2="${W-left}" y2="${ys(goal).toFixed(1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-left}" y="${(ys(goal)-4).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--muted)">meta ${goal}</text>`;
  const iMax=vals.indexOf(Math.max(...vals));
  vals.forEach((v,i)=>{
    const x=left+i*bw+2,w=Math.max(2,bw-4),y=ys(v),h=H-bot-y;
    if(v>0)g+=`<path d="M${x.toFixed(1)} ${H-bot}V${(y+Math.min(4,h)).toFixed(1)}q0 -${Math.min(4,h).toFixed(1)} ${Math.min(4,w/2).toFixed(1)} -${Math.min(4,h).toFixed(1)}H${(x+w-Math.min(4,w/2)).toFixed(1)}q${Math.min(4,w/2).toFixed(1)} 0 ${Math.min(4,w/2).toFixed(1)} ${Math.min(4,h).toFixed(1)}V${H-bot}Z" fill="var(--accent)"/>`;
    g+=`<rect x="${(left+i*bw).toFixed(1)}" y="${top}" width="${bw.toFixed(1)}" height="${H-bot-top}" fill="transparent"><title>${esc(labels[i])}: ${esc(fmt(v))}</title></rect>`;
    if(i===iMax||i===n-1)g+=`<text x="${(x+w/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="10" text-anchor="middle" fill="var(--ink)">${esc(fmt(v))}</text>`;
    if(i===0||i===n-1||(n>6&&i===Math.floor(n/2)))g+=`<text x="${(x+w/2).toFixed(1)}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(labels[i])}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}

/* Mascote: humanoide cujas formas são interpoladas por massa (ombros, peito, braços) e gordura (barriga, quadril). humor: feliz | neutro | preocupado */

  s+=`<rect x="${f(cx-hw-2)}" y="71" width="${f(2*hw+4)}" height="9" rx="3.5" fill="${acc}"/>`;

/* Lê os últimos 7 dias (saldo médio só dos dias com alimento lançado e nº de treinos) e traduz em estado, rótulo, frase de orientação e forma do mascote */
function avaliarCaminho(){
  const p=state.profile,obj=(p&&p.objetivo)||"manter",now=Date.now();
  let soma=0,dias=0;
  for(let i=0;i<7;i++){const k=dayKey(now-i*864e5);if(!foodDia(k).length)continue;const s=saldoDia(k);if(s==null)continue;soma+=s;dias++;}
  const treinos=state.history.filter(x=>now-x.date<7*864e5).length;
  const saldo=dias?soma/dias:null;
  const r={saldo,dias,treinos,objetivo:obj,massa:.45,gordura:.45,humor:"neutro",estado:"semdados"};
  if(saldo==null){
    r.rotulo="Comece lançando o que comeu";
    r.frase=perfilOk(p)?"O mascote reage ao seu saldo da semana e aos treinos.":"Preencha o perfil e lance as refeições do dia.";
    return r;
  }
  const cl=v=>Math.max(0,Math.min(1,v));
  r.massa=cl(.3+.15*treinos+(saldo>0?.1:0));
  r.gordura=cl(.5+saldo/1500-.08*treinos);
  const menos=round50(saldo+300),mais=round50(-saldo+300),sd=fmtK(Math.abs(saldo));
  if(saldo<=-200){
    if(treinos>=2){
      r.estado="secando";r.rotulo="Secando com músculo";r.humor="feliz";r.gordura=Math.min(r.gordura,.25);r.massa=Math.max(r.massa,.65);
      r.frase=obj==="ganhar"?`Você está em déficit; para ganhar massa, some cerca de ${mais} kcal por dia.`:obj==="manter"?`Déficit de ${sd} kcal por dia: para manter o peso, coma um pouco mais.`:"Mantenha o déficit e treine 3x na semana.";
      if(obj!=="perder")r.humor=obj==="ganhar"?"preocupado":"neutro";
    }else{
      r.estado="perdendo";r.rotulo="Perdendo peso, mas pouca musculação";r.humor="neutro";r.gordura=Math.min(r.gordura,.3);r.massa=Math.min(r.massa,.3);
      r.frase=obj==="ganhar"?`Déficit e pouco treino: some cerca de ${mais} kcal por dia e treine 3x na semana.`:"Inclua 2 a 3 treinos na semana para perder gordura sem perder músculo.";
      if(obj==="ganhar")r.humor="preocupado";
    }
  }else if(saldo>=200){
    if(treinos>=3){
      r.estado="ganhando";r.rotulo="Ganhando massa";r.humor="feliz";r.massa=Math.max(r.massa,.9);r.gordura=Math.max(.4,Math.min(r.gordura,.55));
      r.frase=obj==="perder"?`Você está em superávit; para perder peso, reduza cerca de ${menos} kcal por dia.`:obj==="manter"?`Superávit de ${sd} kcal por dia; reduza um pouco para manter o peso.`:"Superávit com treino frequente: continue assim.";
      if(obj!=="ganhar")r.humor=obj==="perder"?"preocupado":"neutro";
    }else{
      r.estado="acumulando";r.rotulo="Acumulando gordura";r.humor="preocupado";r.gordura=Math.max(r.gordura,.9);r.massa=Math.min(r.massa,.25);
      r.frase=obj==="ganhar"?"Para o superávit virar músculo, treine pelo menos 3x na semana.":`Você está em superávit; para ${obj==="perder"?"perder peso":"manter o peso"}, reduza cerca de ${menos} kcal por dia ou treine mais.`;
    }
  }else{
    r.estado="manutencao";r.rotulo="Manutenção";r.humor=obj==="manter"?"feliz":"neutro";
    r.frase=obj==="perder"?"Saldo equilibrado; para perder peso, mire um déficit de 300 a 500 kcal por dia.":obj==="ganhar"?"Saldo equilibrado; para ganhar massa, some 200 a 300 kcal por dia e treine 3x.":"Peso estável: continue assim.";
  }

}

function backupName(){const d=new Date();return "meu-treino-backup-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";}
function backupJSON(){return JSON.stringify({app:"meu-treino",version:1,exportedAt:new Date().toISOString(),state},null,2);}
async function exportBackup(){
  const name=backupName();
  const json=backupJSON();
  const blob=new Blob([json],{type:"application/json"});
  /* No celular, usa a folha de compartilhamento quando ela aceita arquivos; o download fica como alternativa */
  const mobile=window.matchMedia&&matchMedia("(pointer:coarse)").matches;
  if(mobile&&navigator.share&&navigator.canShare){
    try{
      const file=new File([blob],name,{type:"application/json"});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Backup do Meu treino"});toast("Backup compartilhado");return;}
    }catch(e){if(e&&e.name==="AbortError")return;}
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast("Backup exportado");
}
/* Copia o JSON para a área de transferência: no iOS o download às vezes não aparece, e copiar + colar é a rota mais confiável */
async function copyBackup(){

  if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(json);ok=true;}catch(e){}}

function readFileText(file){

}
/* Aceita o envelope { app, version, state } ou o state cru do localStorage, vindo de arquivo ou de texto colado. Lança erro com mensagem em pt-BR. */
function parseBackup(text){
  const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
  /* Descreve o que foi encontrado, para o usuário saber o que colou/selecionou */
  const descr=v=>{
    if(v===null)return "valor nulo";
    if(Array.isArray(v))return "uma lista com "+v.length+" "+(v.length===1?"item":"itens")+", não um objeto";
    if(typeof v==="string")return "um texto ("+(v.length>40?v.slice(0,40)+"…":v)+")";
    if(typeof v==="number"||typeof v==="boolean")return "um "+(typeof v==="number"?"número":"valor lógico")+" ("+String(v)+")";
    if(isObj(v)){const k=Object.keys(v);return k.length?"um objeto sem os campos esperados. Chaves encontradas: "+k.slice(0,8).join(", ")+(k.length>8?"…":""):"um objeto vazio";}
    return "um valor do tipo "+typeof v;
  };
  let t=String(text==null?"":text).replace(/^\uFEFF/,"").trim();
  /* Colado do console ou de um app de notas: '{"weights":...}' entre aspas simples */
  if(t.length>1&&t[0]==="'"&&t[t.length-1]==="'")t=t.slice(1,-1).trim();
  if(!t)throw new Error("O conteúdo está vazio.");
  let data;
  try{data=JSON.parse(t);}catch(e){throw new Error("O conteúdo não é um JSON válido: "+(e&&e.message?e.message:"erro de sintaxe")+".");}
  /* JSON codificado duas vezes (ex.: copiado do console ou do Notas do iPhone) vira uma string; tenta de novo até 2 vezes */
  for(let i=0;i<2&&typeof data==="string";i++){
    const inner=data.replace(/^\uFEFF/,"").trim();
    try{data=JSON.parse(inner);}catch(e){break;}
  }
  if(!isObj(data))throw new Error("O conteúdo não tem o formato de backup do Meu treino: é "+descr(data)+".");
  /* Versões anteriores do app exportavam o envelope com "estado" e um espelho em pt-BR no nível de cima (cargas, historico, ...) */
  const toMs=v=>{if(typeof v==="number")return v;if(typeof v==="string"){const n=Date.parse(v);if(!isNaN(n))return n;const m=+v;if(!isNaN(m))return m;}return 0;};
  const PT={cargas:"weights",historico:"history",descansos:"rest",trocas:"swaps",sessaoEmAndamento:"session",programas:"programs",programaAtivo:"activeProgram",ultimasReps:"lastReps"};
  const hasPT=o=>isObj(o)&&("cargas" in o||"historico" in o);
  const fromPT=o=>{const r={};for(const k in PT)if(o[k]!==undefined)r[PT[k]]=o[k];if(o.atualizadoEm!==undefined)r.updatedAt=toMs(o.atualizadoEm);return r;};
  const hasEN=o=>isObj(o)&&("history" in o||"weights" in o||"programs" in o);
  const nomes=isObj(data.nomes)?data.nomes:null;
  let s=data;
  if("app" in data||"state" in data||"estado" in data){
    if(data.app!==undefined&&data.app!=="meu-treino")throw new Error("Este backup é de outro aplicativo ("+String(data.app)+").");
    s=data.state!==undefined?data.state:data.estado;
    if(typeof s==="string"){try{s=JSON.parse(s);}catch(e){}}
    if(!hasEN(s)&&hasPT(data))s=fromPT(data);
    if(!isObj(s))throw new Error("O campo \"state\" do backup não é um objeto: é "+descr(s)+".");
  }else if(!hasEN(data)&&hasPT(data))s=fromPT(data);
  if(!("history" in s)&&!("weights" in s)&&!("programs" in s)){
    const k=Object.keys(s);
    throw new Error("O conteúdo não tem os dados esperados (histórico, cargas ou programas)."+(k.length?" Chaves encontradas: "+k.slice(0,8).join(", ")+(k.length>8?"…":"")+".":" O objeto está vazio."));
  }
  if(s.history!==undefined&&!Array.isArray(s.history))throw new Error("O histórico do backup está em formato inválido.");
  if(s.programs!==undefined&&!Array.isArray(s.programs))throw new Error("Os programas do backup estão em formato inválido.");
  if(s.weights!==undefined&&!isObj(s.weights))throw new Error("As cargas do backup estão em formato inválido.");
  const copy=JSON.parse(JSON.stringify(s));
  const num=(v,d)=>{const n=typeof v==="string"?parseFloat(v):v;return Number.isFinite(n)?n:d;};
  /* Normaliza cada treino do histórico para o render nunca depender de campo ausente (formatos antigos não têm prog, label, min...) */
  copy.history=(copy.history||[]).filter(x=>isObj(x)&&Array.isArray(x.ex)).map(x=>{
    const ex=x.ex.filter(e=>isObj(e)&&e.id!=null&&e.id!=="").map(e=>{
      const sets=(Array.isArray(e.sets)?e.sets:[]).filter(isObj).map(y=>({...y,w:num(y.w,0),r:y.r}));
      const r={...e,id:String(e.id),sets};
      if(!EX[r.id]&&!r.n&&nomes&&nomes[r.id])r.n=String(nomes[r.id]);
      return r;
    });
    const nsets=ex.reduce((a,e)=>a+e.sets.length,0);
    const vol=ex.reduce((a,e)=>a+e.sets.reduce((b,y)=>b+(y.w||0)*(num(y.r,0)||0),0),0);
    const r={...x,date:toMs(x.date),day:Math.max(1,Math.round(num(x.day,1))),prog:x.prog||"fullbody6",sets:num(x.sets,nsets),vol:num(x.vol,vol),min:num(x.min,0),ex};
    if(x.kcal!=null)r.kcal=num(x.kcal,0);else delete r.kcal;
    return r;
  });
  copy.programs=(copy.programs||[]).filter(x=>isObj(x)&&x.id&&Array.isArray(x.days));
  /* Calorias: perfil, alimentos por dia e alimentos recentes (ausentes em backups antigos) */
  copy.profile=isObj(copy.profile)?copy.profile:null;
  const food={};
  if(isObj(copy.food))for(const k of Object.keys(copy.food)){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(copy.food[k]))continue;
    const arr=copy.food[k].filter(isObj).map((f,i)=>({id:String(f.id||k+"-"+i),nome:String(f.nome||"Alimento"),g:f.g==null?null:num(f.g,null),kcal:num(f.kcal,0)}));
    if(arr.length)food[k]=arr;
  }
  copy.food=food;
  copy.recentFoods=(Array.isArray(copy.recentFoods)?copy.recentFoods:[]).filter(f=>isObj(f)&&f.nome).slice(0,8);
  if(!(isObj(copy.session)&&isObj(copy.session.sets)&&Number.isFinite(num(copy.session.day,NaN))))copy.session=null;
  if(copy.updatedAt!==undefined)copy.updatedAt=toMs(copy.updatedAt);
  return copy;
}
function replaceState(s){
  state={weights:{...START_W},session:null,history:[],rest:{},swaps:{},lastReps:{},programs:[],activeProgram:"fullbody6",draft:null,profile:null,food:{},recentFoods:[],updatedAt:0,...s};
  normState();applyProgram();
  ui={tab:"inicio",day:null,open:null};
  stopTimer();save();render();scrollTo(0,0);
}
const PASTE_HINT="Se o seletor de arquivos do celular não aceitar o .json, abra o arquivo em um app de arquivos ou notas, copie o conteúdo e use Colar backup.";
async function importBackup(file){
  if(!file)return;
  const nome=file.name?' "'+file.name+'"':"";
  if(!file.size){alert("O arquivo"+nome+" está vazio (0 bytes).\n\n"+PASTE_HINT+"\n\nNada foi alterado.");return;}
  let text;
  try{text=await readFileText(file);}
  catch(e){alert("Não foi possível ler o arquivo"+nome+".\n\n"+(e&&e.message?e.message+"\n\n":"")+PASTE_HINT+"\n\nNada foi alterado.");return;}
  importBackupText(text);
}
/* Fluxo comum de arquivo e texto colado: valida, confirma, guarda o estado para desfazer e aplica. Retorna true se importou. */
function importBackupText(text){
  try{
    const s=parseBackup(text);
    const nh=s.history.length,np=s.programs.length;
    const when=s.updatedAt?new Date(s.updatedAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
    const msg=`Importar este backup?\n\nEle tem ${nh} ${nh===1?"treino":"treinos"} no histórico e ${np} ${np===1?"programa seu":"programas seus"}${when?", salvo em "+when:""}.\n\nTodo o conteúdo atual deste aparelho (histórico, cargas, programas e treino em andamento) será substituído. Uma cópia do estado atual fica guardada para você desfazer.`;
    if(!confirm(msg))return false;
    try{localStorage.setItem(LS_UNDO,JSON.stringify(state));}catch(e){}
    replaceState(s);
    toast(`Backup importado: ${nh} ${nh===1?"treino":"treinos"}`);
    return true;
  }catch(e){
    alert("Não foi possível importar o backup.\n\n"+(e&&e.message?e.message:"Erro desconhecido.")+"\n\nNada foi alterado.");
    return false;
  }
}
function undoImport(){
  let prev=null;
  try{prev=JSON.parse(localStorage.getItem(LS_UNDO)||"null");}catch(e){}
  if(!prev||typeof prev!=="object"){toast("Não há importação para desfazer");try{localStorage.removeItem(LS_UNDO);}catch(e){}render();return;}
  if(!confirm("Desfazer a última importação e voltar aos dados que existiam antes dela?\n\nO que foi importado será descartado."))return;
  try{localStorage.removeItem(LS_UNDO);}catch(e){}
  replaceState(prev);
  toast("Importação desfeita");
}

    }).join("");
  }

  $("#app").innerHTML=h;setSync();

  if(t.dataset.b)return builderClick(t);
  if(t.id==="homestart"){ui.tab="treino";ui.day=nextDay();ui.open=null;render();scrollTo(0,0);return;}
  if(t.dataset.hx){ui.homeEx=t.dataset.hx;render();return;}
  if(t.id==="bkexp"){exportBackup();return;}
  if(t.id==="bkimp"){const f=$("#impfile");f.value="";f.click();return;}
  if(t.id==="bkundo"){undoImport();return;}
  if(t.id==="bkcopy"){copyBackup();return;}
  if(t.id==="bkpaste"){if(ui.bkpaste&&$("#bkpastebox")&&!$("#bkpastebox").hidden)closePasteBox();else openPasteBox();return;}
  if(t.id==="bkpastecancel"){closePasteBox();return;}
  if(t.id==="bkpasteok"){const ta=$("#bktext");if(!ta)return;if(importBackupText(ta.value))closePasteBox();else ta.focus();return;}
  if(t.dataset.cal!==undefined){const hoje=dayKey(Date.now()),n=+t.dataset.cal;const d=keyDate(ui.calKey||hoje);d.setDate(d.getDate()+n);ui.calKey=n?dayKey(d):hoje;if(ui.calKey>hoje)ui.calKey=hoje;ui.fsel=null;render();scrollTo(0,0);return;}
  if(t.dataset.sug!==undefined){pickFood(FOODS[+t.dataset.sug]);return;}
  if(t.dataset.rf!==undefined){const f=state.recentFoods[+t.dataset.rf];if(f)addFood(f.nome,f.g,f.kcal,f.k100);return;}
  if(t.dataset.frm){const k=ui.calKey||dayKey(Date.now());const arr=foodDia(k).filter(f=>f.id!==t.dataset.frm);if(arr.length)state.food[k]=arr;else delete state.food[k];save();const y=scrollY;render();scrollTo(0,y);toast("Alimento removido");return;}
  if(t.id==="fadd"){submitFood();return;}
  if(t.dataset.tab){ui.tab=t.dataset.tab;if(ui.tab==="calorias"){ui.calKey=null;ui.fsel=null;}render();scrollTo(0,0);return;}
  if(t.dataset.day){ui.day=+t.dataset.day;ui.open=null;render();return;}
  if(t.id==="finish")return finish();
  if(t.id==="reset"){state.session=null;save();render();return;}
  const card=t.closest(".ex");if(!card)return;
  const key=card.dataset.key,i=+card.dataset.i,day=ui.day,it=item(day,i);
  if(t.dataset.act==="toggle"){ui.open=ui.open===key?null:key;ui.swap=null;rerenderCard(card,day,it,i);return;}
  if(t.dataset.act==="rest"){state.rest[it.id]=Math.max(15,Math.min(600,restOf(it)+(+t.dataset.d)));save();rerenderCard(card,day,it,i);return;}
  if(t.dataset.act==="swap"){ui.swap=ui.swap===key?null:key;rerenderCard(card,day,it,i);if(ui.swap)revealSwap(i);return;}
  if(t.dataset.act==="pick"){const id=t.dataset.id;ui.swap=null;if(id){const orig=DAYS[day-1].items[i].id;if(id===orig)delete state.swaps[swapKey(day,i)];else state.swaps[swapKey(day,i)]=id;ui.open=id+"#"+i;save();}const y=scrollY;render();scrollTo(0,y);revealCard(i);return;}
  if(t.dataset.act==="done"){
    const row=t.closest(".set"),k=+row.dataset.k;
    const s=ensureSession(day);const arr=s.sets[key]||(s.sets[key]=[]);
    const cur=arr[k]||{};
    const wIn=row.querySelector('[data-f="w"]').value.replace(",","."),rIn=row.querySelector('[data-f="r"]').value;
    cur.w=wIn===""?null:+wIn;cur.r=rIn===""?+minReps(it.r)||null:+rIn;
    cur.done=!cur.done;arr[k]=cur;
    if(cur.done){
      if(cur.w!=null&&!isNaN(cur.w))state.weights[it.id]=cur.w;
      if(cur.r!=null&&!isNaN(cur.r))state.lastReps[it.id]=cur.r;
      startTimer(restOf(it),EX[it.id].n);keepAwake();askNotify();
    }
    save();rerenderCard(card,day,it,i);updateTop(day);
  }
});
document.addEventListener("input",ev=>{
  const inp=ev.target;
  if(inp.dataset&&inp.dataset.pf){profInput(inp,false);return;}
  if(inp.id==="fname"){ui.fsel=null;suggHTML(inp.value);const hint=$("#fhint");if(hint)hint.textContent=FHINT;return;}
  if(inp.id==="fg"){calcFood();return;}
  if(inp.dataset&&inp.dataset.bf&&state.draft){
    const d=state.draft,f=inp.dataset.bf;
    if(f==="name")d.name=inp.value;
    else if(f==="label"&&d.days[+inp.dataset.di])d.days[+inp.dataset.di].extra=inp.value.slice(0,8);
    else if(f==="reps"){const x=d.days[+inp.dataset.di]&&d.days[+inp.dataset.di].items[+inp.dataset.xi];if(x)x.r=inp.value;}
    save();return;
  }
  if(!inp.dataset||!inp.dataset.f)return;
  const card=inp.closest(".ex"),row=inp.closest(".set");if(!card||!row)return;
  const key=card.dataset.key,k=+row.dataset.k,day=ui.day,f=inp.dataset.f;
  const id=item(day,+card.dataset.i).id;
  const v=inp.value.replace(",",".").trim(),num=v===""?null:+v,ok=num!=null&&isFinite(num)&&num>=0;
  const s=state.session&&state.session.day===day?state.session:null;
  if(s){const arr=s.sets[key]||(s.sets[key]=[]);const cur=arr[k]||(arr[k]={w:null,r:null,done:false});
    if(v===""||ok)cur[f]=num;}
  save();
});
document.addEventListener("change",ev=>{
  const inp=ev.target;
  if(inp.dataset&&inp.dataset.pf){profInput(inp,true);return;}
  if(!inp.dataset||!inp.dataset.f)return;
  const card=inp.closest(".ex");if(!card)return;
  const id=item(ui.day,+card.dataset.i).id;
  const v=inp.value.replace(",",".").trim(),num=v===""?null:+v;
  if(num==null||!isFinite(num)||num<0)return;
  if(inp.dataset.f==="w")state.weights[id]=num;else state.lastReps[id]=num;
  save();
});
function rerenderCard(el,day,it,i){
  const tmp=document.createElement("div");tmp.innerHTML=cardHTML(day,it,i);el.replaceWith(tmp.firstElementChild);
}
/* No celular o painel de troca abre abaixo do botão, muitas vezes atrás da barra de abas ou fora da tela
   (ainda mais quando o teclado acabou de fechar e a página se moveu): rola só o necessário para mostrá-lo inteiro */
function revealSwap(i){
  const f=()=>{const p=document.querySelector(`.ex[data-i="${i}"] .swap`);if(!p)return;
    const r=p.getBoundingClientRect(),nav=$("nav.tabs"),lim=innerHeight-(nav?nav.getBoundingClientRect().height:0)-8;
    if(r.bottom>lim)scrollBy({top:Math.min(r.bottom-lim,Math.max(0,r.top-8)),behavior:"smooth"});};
  requestAnimationFrame(f);setTimeout(f,450);
}
/* Depois de escolher o substituto, garante que o cabeçalho do card (com o novo exercício) esteja na tela */
function revealCard(i){
  const c=document.querySelector(`.ex[data-i="${i}"]`);if(!c)return;
  const r=c.getBoundingClientRect();if(r.top<0||r.top>innerHeight-120)c.scrollIntoView({block:"start",behavior:"smooth"});
}
function updateTop(day){
  const plan=DAYS[day-1];const total=plan.items.reduce((a,it)=>a+it.s,0);
  const done=plan.items.reduce((a,_,i)=>a+exProgress(day,item(day,i),i),0);
  const bar=document.querySelector(".bar i");if(bar)bar.style.width=(done/total*100)+"%";
  const p=document.querySelector(".bar+p");if(p)p.textContent=`${done} de ${total} séries feitas`;
  const f=$("#finish");if(f)f.disabled=!done;
  if(!$("#reset")&&done){const a=document.querySelector(".actions");if(a&&f){f.insertAdjacentHTML("afterend",'<button class="btn ghost" id="reset" type="button">Descartar séries deste treino</button>');}}
}
function finish(){
  const s=state.session;if(!s)return;
  const plan=DAYS[s.day-1];let n=0,vol=0;const ex=[];
  plan.items.forEach((_,i)=>{const it=item(s.day,i);
    const arr=(s.sets[it.id+"#"+i]||[]).filter(x=>x&&x.done);
    if(!arr.length)return;
    arr.forEach(x=>{n++;vol+=(x.w||0)*(x.r||0);});
    ex.push({id:it.id,sets:arr.map(x=>({w:x.w,r:x.r}))});
  });
  if(!n)return;
  const entry={date:Date.now(),day:s.day,prog:state.activeProgram,label:plan.extra,sets:n,vol,min:Math.max(1,Math.round((Date.now()-s.startedAt)/60000)),ex};
  const kc=kcalTreino(entry);if(kc!=null)entry.kcal=kc; /* fixa a estimativa com o peso atual do perfil */
  state.history.unshift(entry);
  state.history=state.history.slice(0,150);
  state.session=null;ui.day=null;ui.open=null;stopTimer();releaseAwake();
  save();render();scrollTo(0,0);toast(`Treino concluído: ${n} séries`);
}
let tEnd=0,tInt=null;
function startTimer(sec,name){
  tEnd=Date.now()+sec*1000;$("#tl").textContent="Descanso após "+name;
  const t=$("#timer");t.classList.add("on");t.classList.remove("end");
  clearInterval(tInt);tick();tInt=setInterval(tick,250);
}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $("#tt").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  if(left===0){clearInterval(tInt);const t=$("#timer");t.classList.add("end");$("#tl").textContent="Hora da próxima série";
    try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
    beep();notifyEnd();
    setTimeout(()=>{if(Date.now()>=tEnd)stopTimer();},6000);}
}
function stopTimer(){clearInterval(tInt);$("#timer").classList.remove("on","end");}
let wl=null;
async function keepAwake(){try{if("wakeLock" in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null;});}}catch(e){}}
function releaseAwake(){try{wl&&wl.release();}catch(e){}wl=null;}
function askNotify(){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();}catch(e){}}
function notifyEnd(){try{if(document.hidden&&"Notification" in window&&Notification.permission==="granted")new Notification("Descanso acabou",{body:"Hora da próxima série",tag:"descanso"});}catch(e){}}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;
  if(state.session)keepAwake();
  if($("#timer").classList.contains("on")&&!$("#timer").classList.contains("end")&&Date.now()>=tEnd)tick();
});
$("#tplus").onclick=()=>{tEnd=Math.max(tEnd,Date.now())+15000;$("#timer").classList.remove("end");clearInterval(tInt);tick();tInt=setInterval(tick,250);};
$("#tskip").onclick=stopTimer;
/* O card do perfil é um <details>: lembra se o usuário abriu ou fechou entre renders (toggle não borbulha, por isso captura) */
document.addEventListener("toggle",ev=>{if(ev.target&&ev.target.id==="profbox")ui.profOpen=ev.target.open;},true);
$("#impfile").addEventListener("change",ev=>{const f=ev.target.files&&ev.target.files[0];importBackup(f).finally(()=>{ev.target.value="";});});
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2600);}

render();

const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Só o card aberto anima (miniaturas e demais cards ficam na pose de pico, igual ao modo de movimento reduzido);
   cerca de 30 quadros por segundo bastam e poupam bateria */
let figT0=performance.now(),figLast=0;
function figLoop(now){
  requestAnimationFrame(figLoop);
  if(now-figLast<33)return;figLast=now;
  const k=((now-figT0)/CYCLE_MS)%1;
  document.querySelectorAll(".ex.open svg.fig").forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.bottom<0||r.top>innerHeight)return;
    el.innerHTML=figSVG(el.dataset.fig,k);
  });
}
if(!RM)requestAnimationFrame(figLoop);

(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u)return;
    const uid=await u.id();if(!uid)return;
    db=d;docRef=db.doc("data/users/"+uid+"/treino");
    const snap=await docRef.get();
    if(snap.exists){
      const remote=snap.data();
      if(remote&&(remote.updatedAt||0)>(state.updatedAt||0)){
        state={...state,...JSON.parse(JSON.stringify(remote))};
        try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
        normState();applyProgram();
        ui.day=null;render();
      }else if((state.updatedAt||0)>(remote.updatedAt||0)){push();}
      cloud=true;
    }else{await push();}
    setSync();
  }catch(e){setSync();}
})();
</script>
