<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu treino</title>
<meta name="theme-color" content="#05080D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Meu treino">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080D;--surface:rgba(16,24,36,.72);--surface2:#111A26;--ink:#EAF2FA;--muted:#9AA8BA;--line:#223044;
  --y-100:#FFF6D6;--y-300:#FFE680;--y-500:#FFD200;--y-600:#F7A600;--y-800:#8A5A00;--neon:#E8FF00;
  --accent:var(--y-500);--accent-ink:#1D1500;--lime:var(--y-600);--done:var(--neon);--done-soft:rgba(232,255,0,.12);--danger:#FF7A7A;--ok:#8DFF5A;--warn:#FFB454;
  --peito:#FF8A5C;--costas:#5AB0FF;--biceps:#B79CFF;--triceps:#FF6FA8;--ombro:#D9A066;--pernas:#B8FF3C;--core:#FF5A6E;
  --glass:rgba(10,16,26,.78);--glow:0 0 18px rgba(255,210,0,.22);
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 24px}
.display{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;letter-spacing:.01em}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 2px 14px}
header.top h1{margin:0;font-size:2.4rem;line-height:1;font-weight:800}
.sync{font-size:.8rem;color:var(--muted);text-align:right}
/* day plates */
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.day{position:relative;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.day .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.55rem;line-height:1}
.day .t{font-size:.62rem;color:var(--muted);margin-top:1px}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.sel .t{color:var(--accent-ink);opacity:.8}
.day .next{position:absolute;top:-4px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--done);border:2px solid var(--bg)}
.hero{margin:0 2px 16px}
.hero h2{margin:0;font-size:2.9rem;line-height:.95;font-weight:800}
.hero p{margin:6px 0 0;color:var(--muted)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.groups{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip b{width:8px;height:8px;border-radius:50%;display:inline-block}
/* exercises */
.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.ex.complete{border-color:var(--done)}
.exh{width:100%;display:flex;align-items:center;gap:11px;padding:12px;background:none;border:0;text-align:left}
.ring{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1rem;border:3px solid var(--line);color:var(--muted)}
.ex.complete .ring{border-color:var(--done);background:var(--done);color:#fff}
.ex.partial .ring{border-color:var(--accent);color:var(--ink)}
.exh .info{flex:1;min-width:0}
.thumb{flex:none;width:68px;height:62px;border-radius:12px;background:var(--surface2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb svg{display:block;width:100%;height:100%}.thumb svg.noimg{width:30px;height:30px}
/* Fotos em fluxo normal (sem position absolute): miniatura recortada na caixa; no detalhe, início e fim lado a lado */
.ph{display:block;width:100%;height:100%;overflow:hidden;border-radius:inherit;background:#fff}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.big.fig1{display:block;background:var(--surface2);border-radius:12px;max-width:320px;margin:0 auto 12px}
.big.fig1 svg{display:block;width:100%;height:auto;aspect-ratio:160/136}
.big figure{margin:0;min-width:0;background:#fff;border-radius:12px;overflow:hidden}
.big figure img{display:block;width:100%;height:auto;max-height:200px;object-fit:contain}
.big figcaption{font-size:.75rem;color:#5D6570;text-align:center;padding:2px 0 4px}
.credito{font-size:11px;color:var(--muted,#888);text-align:center;margin:0 16px;padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
.credito a{color:inherit;display:inline-block;padding:12px 4px}
.exh .name{font-weight:600;font-size:1.05rem;line-height:1.2}
.exh .meta{font-size:.88rem;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.exh .grp{display:inline-flex;align-items:center;gap:5px}
.exh .grp b{width:8px;height:8px;border-radius:50%}
.mvt{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:6px;border:1px solid currentColor;vertical-align:middle;opacity:.85;margin-left:4px}
.mv-push{color:var(--peito,#d9534f)}.mv-pull{color:var(--costas,#3b82f6)}.mv-core{color:var(--abdomen,#8a8a8a)}
.tag{font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.chev{flex:none;width:22px;height:22px;color:var(--muted);transition:transform .2s}
.ex.open .chev{transform:rotate(180deg)}
.exb{padding:0 14px 16px;display:none}
.ex.open .exb{display:block}
.how{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.how ol{margin:0;padding-left:20px}
.how li{margin:3px 0}
.how .vid{display:inline-flex;align-items:center;gap:6px;margin-top:6px;min-height:44px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--accent)}
details.how summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.95rem}
details.how summary::-webkit-details-marker{display:none}
details.how .sch{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .2s}
details.how[open] .sch{transform:rotate(180deg)}
details.how ol{margin-top:8px}
.how .dt{margin:10px 0 2px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.how .dicas{margin:0;padding-left:20px;font-size:.9rem}
.how .dicas li{margin:2px 0}
.mrow{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.mrow .chip{color:var(--ink)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center}
.set .sn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;color:var(--muted);text-align:center}
.fld{position:relative}
.fld input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 34px 0 12px;font-size:1.15rem;font-weight:600}
.fld span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:.8rem;color:var(--muted);pointer-events:none}
.chk{height:48px;border-radius:12px;border:2px solid var(--line);background:none;display:flex;align-items:center;justify-content:center}
.chk svg{width:22px;height:22px;opacity:.35}
.set.done .chk{background:var(--done);border-color:var(--done);color:#fff}
.set.done .chk svg{opacity:1}
.set.done input{background:var(--done-soft);border-color:transparent}
.hint{font-size:.82rem;color:var(--muted);margin-top:10px}
.prog{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--done-soft);color:var(--ink);font-size:.9rem}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.restrow{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.restrow b{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;color:var(--ink);min-width:44px;text-align:center}
.restrow button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1.2rem;font-weight:700}
.swapbtn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:.88rem}
.swap{margin-top:10px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.swap p{margin:0 0 8px;font-size:.88rem;color:var(--muted)}
.swap button{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.loads details summary{display:flex;justify-content:space-between;padding:11px 14px;cursor:pointer;list-style:none}
.loads details summary::-webkit-details-marker{display:none}
.loads details{border-top:1px solid var(--line)}
.loads details:first-child{border-top:0}
.chart{display:block;width:100%;height:auto;padding:0 10px 10px}
.loads .empty{padding:0 14px 12px;font-size:.85rem}
.actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.btn{min-height:44px;height:54px;border-radius:16px;border:0;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);min-height:44px;height:46px;font-weight:600;font-size:.95rem}
.rest{margin:28px 2px;text-align:center;color:var(--muted)}
/* history */
.sec{margin:26px 2px 10px;font-size:1.5rem;font-weight:800}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.hist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.hist .d1{font-weight:600}
.hist .d2{font-size:.85rem;color:var(--muted)}
.hist .kg{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.6rem;line-height:1}
.hist ul{margin:12px 0 0;padding:0;list-style:none;font-size:.92rem}
.hist li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.hist li span:last-child{color:var(--muted);text-align:right}
.loads{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.loads b{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem}
.empty{color:var(--muted);padding:6px 2px}
/* timer + tabs */
.timer{position:fixed;left:50%;transform:translate(-50%,140%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(588px,calc(100% - 24px));border-radius:18px;display:flex;align-items:center;gap:12px;z-index:20;transition:transform .25s;visibility:hidden}
.timer.on{transform:translate(-50%,0);visibility:visible}
.timer .tt{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2.1rem;line-height:1;min-width:84px}
.timer .tl{flex:1;min-width:0;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:0;border-radius:10px;padding:0 12px;font-weight:600;color:inherit}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
nav.tabs div{display:flex;width:100%;max-width:620px}
nav.tabs button{flex:1;height:62px;border:0;background:none;color:var(--muted);font-weight:600;font-size:.85rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
.days.d7 .day .n{font-size:1.2rem}.days.d7 .day .t{font-size:.55rem}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.pcard h4{margin:0;font-size:1.05rem}.pcard .d2{font-size:.85rem;color:var(--muted);margin:4px 0 0;overflow-wrap:anywhere}
.prow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.prow .btn{height:44px;padding:0 14px;font-size:.92rem;border-radius:12px}
.prow .btn.ghost{height:44px}
.bday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.bday .lbl{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bday .lbl input,.bname{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-weight:600;min-width:0}
.bname{width:100%}
.bex{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bex .nm{flex:1 1 100%;font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:6px}
.bex .nm b{width:8px;height:8px;border-radius:50%;flex:none}
.bex .rp{width:86px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 8px}
.bex .ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.bex .tg{height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:.82rem;font-weight:600}
.bex .tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bex .restrow{gap:4px}
.picker .swap h5{margin:8px 0 2px;font-size:.85rem;display:flex;align-items:center;gap:6px}
nav.tabs button.sel{color:var(--ink)}
nav.tabs button.sel svg{color:var(--accent)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--done);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;transition:transform .25s}
.toast.on{transform:translate(-50%,0)}
.cta{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 16px;margin-bottom:18px;animation:ctaIn .5s ease-out both}
.cta h2{margin:0;font-size:2.3rem;line-height:.95;font-weight:800}
.cta p{margin:6px 0 0;color:var(--muted)}
.cta .btn{width:100%;margin-top:16px;animation:ctaPulse 2s ease-in-out infinite}
@keyframes ctaIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ctaPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,#F4B321 55%,transparent);transform:scale(1)}50%{box-shadow:0 0 0 10px color-mix(in srgb,#F4B321 0%,transparent);transform:scale(1.015)}}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.tile .k{font-size:.8rem;color:var(--muted)}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.9rem;line-height:1.05;overflow-wrap:anywhere}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile .up{color:var(--done);font-weight:600}.tile .dn{color:var(--danger);font-weight:600}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;margin-bottom:10px}
.gcard h4{margin:0 10px 6px;font-size:1rem}
.gcard .hint{margin:4px 10px 0}
.gcard .groups{margin:0 10px 8px}
.gcard .chip{border:0;cursor:pointer}
.gcard .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.gcard details{margin:6px 10px 0;font-size:.85rem;color:var(--muted)}
.gcard table{width:100%;border-collapse:collapse;margin-top:4px}.gcard td{padding:2px 0;border-top:1px solid var(--line)}.gcard td:last-child{text-align:right}
.bkcard .prow .btn{flex:1 1 150px}
.bkpaste{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bkpaste textarea{display:block;width:100%;min-height:150px;box-sizing:border-box;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:10px 12px;font:500 .85rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;overflow-wrap:anywhere}
.bkpaste textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
/* edição no card, seletor de exercício, mapa muscular e formulário do personalizado */
.edrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.edrow>button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:.88rem}
.edrow>button:disabled{opacity:.4;cursor:default}
.edrow>button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpe{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.rpe input{width:100px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 8px;font-weight:600}
.addex{display:block;width:100%;height:46px;margin-top:10px}
.ref{font-size:.72rem;color:var(--muted);margin:-4px 0 10px}
.mmap{margin:0 0 12px;background:var(--surface2);border-radius:12px;padding:8px}
.mmv{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:300px;margin:0 auto}
.mmv svg{display:block;width:100%;height:auto}
.mleg{display:flex;justify-content:center;gap:14px;font-size:.78rem;color:var(--muted);margin-top:4px}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
:root{--mm-p:var(--neon);--mm-s:rgba(247,166,0,.55);--mm-0:transparent;--abdomen:#FF5A6E;--antebraco:#E0A86A}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--bg);width:100%;max-width:620px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.shd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.shd h3{margin:0;font-size:1.7rem;font-weight:800}
.shd .x{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem}
.fl{margin:10px 0 0}.fl .chip,.cxf .chip{border:0;cursor:pointer;padding:6px 11px;min-height:32px;color:var(--ink)}
.fl .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.olist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.opt{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.opt .on{font-weight:600}.os{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.bex .os{flex:1 1 100%;margin-top:-4px}
.bex .rp.kg{width:70px}
.cxf{display:flex;flex-direction:column;gap:10px}
.cxf label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.cxf input,.cxf select,.cxf textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:8px 12px;font-weight:600;color:var(--ink)}
.cxg h5{margin:4px 0;font-size:.85rem}
.cxf .chip.pc{white-space:normal;text-align:left;line-height:1.2;border-radius:14px}.cxf .chip.p{background:var(--mm-p);color:#fff}.cxf .chip.s{background:var(--mm-s);color:var(--ink)}
body.noscroll{overflow:hidden}
/* ===== Tema escuro com acento neon: vidro sutil, brilho nos estados ativos ===== */
body{background:radial-gradient(900px 520px at 85% -10%,rgba(255,210,0,.10),transparent 60%),radial-gradient(700px 480px at -10% 30%,rgba(184,255,60,.06),transparent 60%),var(--bg);background-attachment:fixed}
body::before{background:var(--bg)}
.ex,.pcard,.hist,.tile,.gcard,.loads,.cta,.bday,.card{background:var(--surface);border:1px solid rgba(255,255,255,.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.cta{border-color:rgba(255,210,0,.25);box-shadow:var(--glow)}
.btn{background:linear-gradient(135deg,#FFD84D,#F4B321 55%,#F7A600);color:#1D1500;box-shadow:0 4px 16px rgba(244,179,33,.22);transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.98)}
@media (hover:hover){.btn:hover{box-shadow:0 6px 24px rgba(244,179,33,.38)}.btn:active{box-shadow:0 0 0 3px rgba(244,179,33,.35),0 6px 24px rgba(244,179,33,.4)}}
.btn:focus-visible,.day.sel:focus-visible{outline-color:var(--y-100);outline-offset:3px}
::placeholder{color:var(--muted);opacity:1}
.btn.ghost{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.chip{background:rgba(255,255,255,.06)}
.day{background:var(--surface2);border-color:var(--line);transition:background .2s,box-shadow .2s}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 16px rgba(255,210,0,.45)}
.bar{background:rgba(255,255,255,.08)}
.bar i{background:linear-gradient(90deg,var(--accent),var(--lime));box-shadow:0 0 10px rgba(255,210,0,.5)}
.ex{transition:border-color .2s,box-shadow .2s}
.ex.complete{border-color:rgba(232,255,0,.45)}
.ex.complete .ring{color:#0A1400}
.ex.partial .ring{border-color:var(--accent)}
.set.done .chk{color:#0A1400}
.fld input,.rpe input,.bname,.bday .lbl input,.bex .rp{background:#0C141F;border-color:var(--line)}
.fld input:focus,.bname:focus,.bex .rp:focus,.rpe input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,210,0,.18)}
.toast{background:#0E1A26;color:var(--ink);border:1px solid rgba(255,210,0,.4);box-shadow:var(--glow)}
nav.tabs{background:var(--glass);border-top:1px solid rgba(255,255,255,.07);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
nav.tabs button{min-height:44px;transition:color .2s}
nav.tabs button.sel svg{filter:drop-shadow(0 0 6px rgba(255,210,0,.7))}
.tag{background:var(--accent);color:var(--accent-ink)}
.sec{font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--y-300)}
.display{color:var(--y-100)}
.ex .name,.optm .on{color:var(--y-100)}
/* timer */
.timer{background:var(--glass);color:var(--ink);border:1px solid rgba(255,210,0,.35);box-shadow:var(--glow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);flex-wrap:wrap;padding:12px 14px 16px}
.timer .tt{color:var(--accent);text-shadow:0 0 12px rgba(255,210,0,.6)}
.timer .tl{display:flex;flex-direction:column;opacity:1}
.timer .tl .tk{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.timer button{min-height:44px;min-width:44px;background:rgba(255,255,255,.08)}
.timer .tbar{position:absolute;left:14px;right:14px;bottom:7px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.timer .tbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--lime))}
.timer.end{background:#2A2400;border-color:var(--done);color:var(--ink)}
.timer.end .tt{color:var(--done)}
/* fora da aba Treino o descanso vira uma pílula compacta no topo, sem cobrir a barra de salvar nem o conteúdo */
body:not(.t-treino) .timer{left:auto;right:12px;top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;width:auto;transform:translateY(-220%);padding:4px 14px;gap:0;flex-wrap:nowrap}
body:not(.t-treino) .timer.on{transform:none}
body:not(.t-treino) .timer .tl,body:not(.t-treino) .timer button,body:not(.t-treino) .timer .tbar{display:none}
body:not(.t-treino) .timer .tt{font-size:1.5rem;min-width:0}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
body.hasbar .credito{padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))}
/* ===== Mapa do corpo (fallback esquemático ou humanoid.js); estados definidos aqui ===== */
.bmap{position:relative;min-width:0}
.bmap svg{display:block;width:100%;height:auto;overflow:visible}
.schem .mm-body{fill:#18222F}
.schem .mm{fill:rgba(150,180,210,.12);stroke:rgba(150,200,240,.22);stroke-width:.5}
.bmap .mm{transition:fill .2s,fill-opacity .2s,filter .2s}
.bmap .mm.on-p{fill:var(--mm-p);fill-opacity:1;filter:drop-shadow(0 0 2px var(--mm-p)) drop-shadow(0 0 7px var(--mm-p))}
.bmap .mm.on-s{fill:var(--y-600);fill-opacity:.55;filter:drop-shadow(0 0 2px rgba(255,210,0,.45))}
.bmap .mm.sel{stroke:var(--neon);stroke-width:1.6px;vector-effect:non-scaling-stroke;paint-order:stroke}
.bmap.tap .mm{cursor:pointer}
.bmap.tap .mm{outline:none}
.bmap.tap .mm:hover{fill:var(--mm-p);fill-opacity:.3}
.bmap.tap .mm:focus-visible{fill:var(--mm-p);stroke:var(--y-100);stroke-width:2px;vector-effect:non-scaling-stroke;fill-opacity:.5}
.bmap.tap .mm.on-p:hover,.bmap.tap .mm.on-p:focus-visible{fill-opacity:1}
.bmap [data-porc-fibers]{pointer-events:none}
.bmap .mm.plan-p{fill:var(--y-500);fill-opacity:.25}
.bmap .mm.plan-s{fill:var(--y-500);fill-opacity:.12}
.bmap .mm.mid-p{fill:var(--mm-p);fill-opacity:.55;filter:drop-shadow(0 0 2px var(--mm-p))}
.bmap .mm.mid-s{fill:var(--y-600);fill-opacity:.32}
.pmap{margin:18px 0 8px}
.pmap .mmap{margin:0}
.pleg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:.78rem;color:var(--muted);margin:0 0 8px}
.pleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pleg .lg0{background:var(--y-500);opacity:.3}.pleg .lg1{background:var(--mm-p);opacity:.55}.pleg .lg2{background:var(--mm-p);box-shadow:0 0 6px var(--mm-p)}
.vlbl{display:block;text-align:center;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.mmap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:10px}
.mmv{max-width:320px}
.act{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.act p{margin:0;display:flex;gap:8px;align-items:baseline}
.dots{flex:none;display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mm-p);display:inline-block}
.dots i.f{background:var(--mm-p);box-shadow:0 0 6px var(--mm-p)}
.dots.s i.f{background:var(--y-600);opacity:.8;box-shadow:none}.dots.s i{border-color:var(--y-600)}
.sexsw,.seg{display:inline-flex;padding:3px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);gap:2px}
.sexsw button,.seg button{min-height:44px;min-width:44px;padding:0 12px;border:0;border-radius:11px;background:none;color:var(--muted);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;transition:background .18s,color .18s}
.sexsw button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 12px rgba(255,210,0,.4)}
.sexsw svg{width:16px;height:16px}
.mmap .sexsw{margin:8px auto 0;display:flex;width:max-content}
/* ===== Mapa 3D: cartão com frente e costas girado por arrasto ===== */
.b3w{min-width:0}
.b3{position:relative;perspective:900px;padding:6px 14px;overflow:hidden;touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.b3.drag{cursor:grabbing}
.b3c{position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform;overflow:visible}
.b3c.anim{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.b3f{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.b3f.bk{position:absolute;inset:0;transform:rotateY(180deg)}
.b3c.n4 .b3f{backface-visibility:visible;-webkit-backface-visibility:visible;will-change:opacity,transform}
.b3c.n4 .b3f.q:not(.f-front){position:absolute;inset:0}
.b3c.n4.anim .b3f{transition:opacity .4s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.b3f .mir{transform:scaleX(-1)}
.b3c.n4+.b3l{display:none}
.b3l{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.08) 50%,rgba(0,0,0,.55));border-radius:12px}
.b3bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:4px;min-height:28px}
.b3x{min-height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--accent);background:rgba(30,22,0,.8);color:var(--y-100);font-size:.76rem;font-weight:600}
.b3x[hidden],.b3d[hidden]{display:none}
.b3d{font-size:.72rem;color:var(--muted)}
.seg button.auto{font-size:.74rem;padding:0 8px}
.seg button.auto[aria-pressed="true"]{background:none;color:var(--y-100);box-shadow:inset 0 0 0 1px var(--accent)}
.mmap .seg{margin:8px auto 0;display:flex;width:max-content}
.mmap .b3w{max-width:240px;margin:0 auto}
/* ===== Folha do seletor ===== */
.sheet{background:rgba(2,5,9,.66);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet.enter{animation:fadeIn .2s ease-out}
.sheet.enter .sbox{animation:sheetUp .24s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
.sbox{background:linear-gradient(180deg,#0B121C,#070B11);border:1px solid rgba(255,210,0,.18);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.5);height:calc(100% - 24px - env(safe-area-inset-top,0px));padding-bottom:0;display:flex;flex-direction:column}
.sbody{scrollbar-width:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sbox{overflow:hidden}
.sbody::-webkit-scrollbar{display:none}
.shd h3:focus{outline:none}
.shd .x{background:rgba(255,255,255,.05);border-color:var(--line)}
.shd h3{font-size:1.5rem;min-width:0;overflow-wrap:anywhere;flex:1}
.pkctl{display:flex;gap:8px;align-items:center}
.pkctl .sexsw,.pkctl .seg{flex:1 1 0;min-width:0}
.pkctl .sexsw button,.pkctl .seg button{flex:1;justify-content:center;padding:0 8px;min-width:0}
.pkctl .sexsw{flex:0 0 auto}.pkctl .sexsw button{font-size:0;gap:0;flex:0 0 44px}.pkctl .seg button{padding:0 4px;font-size:.84rem}
.pkmap{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:12px;align-items:start;margin-top:10px}
.pkcol{min-width:0}
.pkfig{position:relative;background:radial-gradient(closest-side,rgba(255,210,0,.10),transparent);border-radius:16px}
.pkside{display:flex;flex-direction:column;gap:10px;min-width:0}
.pkg{margin:0}
.pkg .kicker{display:block}
.pkg b{display:block;font-size:1.9rem;line-height:1;font-weight:800;color:var(--y-100);background:linear-gradient(90deg,var(--y-100),var(--y-500));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 14px rgba(255,210,0,.35)}
.pkg .d2{font-size:.85rem;color:var(--muted);margin:4px 0 0}
.tip{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;padding:6px 10px;border-radius:20px;background:rgba(30,22,0,.9);border:1px solid var(--accent);color:var(--ink);font-size:.8rem;font-weight:600;pointer-events:none;box-shadow:var(--glow)}
.tip i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:ping 1.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,210,0,.7)}100%{box-shadow:0 0 0 10px rgba(255,210,0,0)}}
.pchips{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin:10px 0 0}
.pchips button{min-height:44px;padding:6px 12px;text-align:left;line-height:1.2;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-weight:600;font-size:.9rem;transition:background .18s,border-color .18s,box-shadow .18s}
.pchips button[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,210,0,.16);box-shadow:0 0 12px rgba(255,210,0,.35)}
.fl .chip{min-height:44px}
.lcount{margin:14px 2px 0;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.opt{flex-direction:row;align-items:stretch;padding:0;gap:0;background:var(--surface);border:1px solid rgba(255,255,255,.07);overflow:hidden;transition:border-color .18s}
.opt:hover{border-color:rgba(255,210,0,.35)}
.optm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px 12px;border:0;background:none}
.optm .on{font-weight:600}
.optadd{flex:none;width:64px;border:0;border-left:1px solid rgba(255,255,255,.07);background:rgba(255,210,0,.08);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.optadd .oi{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:700;line-height:1;box-shadow:0 0 10px rgba(255,210,0,.3)}
.optadd.in{color:var(--done)}.optadd.in .oi{border-color:var(--done);font-size:1.2rem;box-shadow:none}
.opt{flex-wrap:wrap}
.opt .sx{flex:1 1 100%;min-height:44px;text-align:left;padding:0 12px;border:0;border-top:1px solid rgba(255,255,255,.07);background:none;color:var(--y-300);font-weight:600;font-size:.82rem}
.opt .sxl{flex:1 1 100%;padding:0 12px 10px}
.pleg{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 2px 0;font-size:.78rem;color:var(--muted)}
.pleg span{display:inline-flex;align-items:center;gap:6px}
.plist{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem}
.plist span{display:inline-flex;align-items:center;gap:5px}
.plist .s{color:var(--muted)}
.plist .hit{color:var(--accent);font-weight:700}
.sfoot{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px;background:linear-gradient(180deg,transparent,#070B11 30%)}
.sfoot .btn{flex:1;height:52px}
.prv .big{margin-top:8px}
/* ===== Montar: editor em passos ===== */
.steps{display:flex;gap:6px;list-style:none;margin:0 0 14px;padding:0}
.steps li{flex:1;min-width:0}
.steps button{width:100%;min-height:44px;display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:inherit;text-align:left;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.steps li{color:var(--muted)}
.card{scroll-margin-top:12px}
.steps li b{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid currentColor;font-size:.75rem}
.steps li.ok{color:var(--ink)}
.steps li.ok button{border-color:rgba(255,210,0,.35)}
.steps li.ok b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{border-radius:18px;padding:14px;margin-bottom:12px}

.stepper{display:inline-flex;align-items:center;gap:4px}

.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.frow>span{color:var(--muted);font-size:.9rem}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}

.dtabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(255,210,0,.4)}
.dtabs .cnt{font-size:.72rem;padding:0 6px;border-radius:8px;background:rgba(0,0,0,.25)}
.dtabs .wr{color:var(--warn)}
.dlbl{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-size:.88rem;color:var(--muted)}
.dlbl input{width:120px;height:44px;border-radius:12px;border:1px solid var(--line);background:#0C141F;padding:0 12px;font-weight:600}
.blist{display:flex;flex-direction:column;gap:8px}
.bex{border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.025);padding:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;transition:box-shadow .15s,transform .15s}
.bex.drag{z-index:5;position:relative;box-shadow:0 0 0 1px var(--accent),var(--glow);background:#0E1824}

.bex .hdl svg{width:16px;height:16px}
.bex .bm{min-width:0}
.bex .nm{font-weight:600;font-size:.98rem;display:flex;align-items:center;gap:6px;flex:none}
.bex .os{margin:2px 0 0;display:block}
.bctl{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:8px;align-items:center}
.bctl label{display:flex;flex-direction:column;gap:2px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bctl .stepper button{width:40px;height:44px}
.bctl .stepper b{min-width:34px;font-size:1.1rem;color:var(--ink)}
.bex .rp{width:92px;height:44px}
.bex .rp.kg{width:72px}
.bex .tg{height:44px;display:inline-flex;align-items:center}
.bhd{width:100%;min-height:44px;display:flex;align-items:center;gap:8px;padding:0;background:none;border:0;text-align:left}
.bhd .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.bhd .bsum{font-size:.82rem;color:var(--muted)}
.bhd .chev{width:20px;height:20px}
.bex.open .bhd .chev{transform:rotate(180deg)}
.bord{display:flex;gap:8px;margin-top:10px}
.bex .ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.bex .ib.rm{color:var(--danger);width:auto;min-width:44px;padding:0 12px}
.bempty{text-align:center;padding:22px 12px;border:1.5px dashed rgba(255,210,0,.3);border-radius:16px;color:var(--muted)}
.bempty svg{width:44px;height:44px;color:var(--accent);filter:drop-shadow(0 0 8px rgba(255,210,0,.5))}
.bempty b{display:block;color:var(--ink);margin:6px 0 2px}
.addbig{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}

<script src="humanoid.js" defer></script>
<script>
/* ===== Ilustrações animadas =====
   Boneco em SVG (viewBox 160x136) montado a cada quadro a partir de poses. Para cada exercício, FIG guarda a pose
   inicial A (músculo alongado) e a pose de pico B (músculo contraído); figSVG(id,k) interpola as duas conforme a fase
   do ciclo (concêntrica 1 s, pausa 0,3 s, excêntrica 1,6 s, pausa 0,4 s), desenha o corpo com volume, o equipamento,
   a região do músculo trabalhado (opacidade acompanha a contração) e as marcações de postura. */
const FL=130;                                   /* linha do chão */
const R=Math.PI/180;
const dir=a=>[Math.sin(a*R),Math.cos(a*R)];     /* 180 = para cima, 90 = para a direita */
const add=(p,v,s=1)=>[p[0]+v[0]*s,p[1]+v[1]*s];
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
const lerp=(a,b,k)=>a+(b-a)*k;
const mix=(p,q,k)=>[lerp(p[0],q[0],k),lerp(p[1],q[1],k)];
const nrm=v=>{const d=Math.hypot(v[0],v[1])||1;return [v[0]/d,v[1]/d];};
const f1=n=>String(Math.round(n*10)/10);
const angOf=(p,q)=>Math.atan2(q[1]-p[1],q[0]-p[0])/R;
/* Cinemática inversa de dois segmentos: devolve [articulação do meio, extremidade] */
function ik(S,T,l1,l2,bend){
  let dx=T[0]-S[0],dy=T[1]-S[1];let d=Math.hypot(dx,dy)||0.001;
  const ux=dx/d,uy=dy/d;
  d=Math.min(Math.max(d,Math.abs(l1-l2)+0.5),l1+l2-0.3);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const E=[S[0]+ux*a-uy*h*bend,S[1]+uy*a+ux*h*bend];
  return [E,[S[0]+ux*d,S[1]+uy*d]];
}
function lerpPose(A,B,k){
  const o={};
  for(const key in A){
    const a=A[key],b=B[key]===undefined?a:B[key];
    if(Array.isArray(a))o[key]=a.map((v,i)=>typeof v==="number"?lerp(v,b[i],k):v);
    else if(typeof a==="number")o[key]=lerp(a,b,k);
    else o[key]=a;
  }
  return o;
}
/* Fases do ciclo de 3,3 s. Devolve e (0 alongado → 1 pico), m (intensidade do músculo), w (força da seta de esforço) */
const CYCLE_MS=3300,KPEAK=1.15/3.3;
const sm=x=>x*x*(3-2*x);
function phase(k){
  const t=(((k%1)+1)%1)*3.3;
  if(t<1){const e=sm(t);return {e,m:.25+.75*e,w:Math.sin(Math.PI*e)};}
  if(t<1.3)return {e:1,m:1,w:0};
  if(t<2.9){const e=1-sm((t-1.3)/1.6);return {e,m:.25+.55*e,w:0};}
  return {e:0,m:.25,w:0};
}
/* Primitivas */
const C=(p,r,c,extra="")=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${c}"${extra}/>`;
const L=(p,q,w,c,extra="")=>`<line x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(q[0])}" y2="${f1(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${extra}/>`;
/* Segmento com volume: cápsula que afina de w1 (em p) para w2 (em q) */
function cap(p,q,w1,w2,c){
  const [ux,uy]=nrm(sub(q,p));const nx=-uy,ny=ux,a=w1/2,b=w2/2;
  return `<path d="M${f1(p[0]+nx*a)} ${f1(p[1]+ny*a)}L${f1(q[0]+nx*b)} ${f1(q[1]+ny*b)}A${b} ${b} 0 0 0 ${f1(q[0]-nx*b)} ${f1(q[1]-ny*b)}L${f1(p[0]-nx*a)} ${f1(p[1]-ny*a)}A${a} ${a} 0 0 0 ${f1(p[0]+nx*a)} ${f1(p[1]+ny*a)}Z" fill="${c}"/>`;
}
/* Normal "da frente" do segmento p→q: a perpendicular que aponta para o lado de F (direção do peito) */
function fnorm(p,q,F){const u=nrm(sub(q,p));let n=[-u[1],u[0]];if(n[0]*F[0]+n[1]*F[1]<0)n=[-n[0],-n[1]];return n;}
/* Elipse de músculo alinhada ao segmento p→q: fr = fração ao longo, off = deslocamento para a frente (negativo = costas),
   rx = meio-comprimento ao longo, ry = meia-largura */
function blob(p,q,fr,off,rx,ry,F){
  const u=nrm(sub(q,p)),n=fnorm(p,q,F);
  const c=add(add(p,u,Math.hypot(q[0]-p[0],q[1]-p[1])*fr),n,off);
  return `<ellipse cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${rx}" ry="${ry}" transform="rotate(${f1(angOf(p,q))} ${f1(c[0])} ${f1(c[1])})"/>`;
}
const ci=(c,r)=>`<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="${r}"/>`;
/* Cargas. db = halter visto de ponta (anilha), dbh = halter de perfil girando com o antebraço (pegada neutra),
   dbu = halter na vertical, bar = barra de ponta, grip = pegador da polia, rope = corda */
function weight(p,kind,ang=0){
  const A="var(--accent)",M="var(--muted)";
  if(!kind)return "";
  if(kind==="db")return C(p,5.2,A)+C(p,3.4,"var(--surface)",' opacity=".35"')+C(p,1.5,M);
  if(kind==="dbh"||kind==="dbu")return `<g transform="translate(${f1(p[0])} ${f1(p[1])}) rotate(${f1(kind==="dbu"?90:ang+90)})"><rect x="-7" y="-1.3" width="14" height="2.6" rx="1.3" fill="${M}"/><rect x="-8.6" y="-5.2" width="4.2" height="10.4" rx="1.3" fill="${A}"/><rect x="4.4" y="-5.2" width="4.2" height="10.4" rx="1.3" fill="${A}"/><rect x="-5.2" y="-3.6" width="1.4" height="7.2" rx=".7" fill="${A}" opacity=".55"/><rect x="3.8" y="-3.6" width="1.4" height="7.2" rx=".7" fill="${A}" opacity=".55"/></g>`;
  if(kind==="bar")return `<rect x="${f1(p[0]-3.2)}" y="${f1(p[1]-2.2)}" width="6.4" height="4.4" rx="2.2" fill="${M}"/>`;
  if(kind==="grip")return C(p,2.7,M);
  if(kind==="rope")return C(p,2.4,M)+`<path d="M${f1(p[0]-1.5)} ${f1(p[1]+1)}l-3.5 7M${f1(p[0]+1.5)} ${f1(p[1]+1)}l3.5 7" stroke="${M}" stroke-width="2.2" stroke-linecap="round" fill="none"/>`+C([p[0]-5.2,p[1]+8.6],1.9,A)+C([p[0]+5.2,p[1]+8.6],1.9,A);
  return "";
}
/* Equipamentos */
const LN="var(--line)",MU="var(--muted)";
const padLine=(p,q,w)=>L(p,q,w+2,MU,' stroke-opacity=".4"')+L(p,q,w,LN);
const EQ={
  floor:`<line x1="4" y1="${FL+1.5}" x2="156" y2="${FL+1.5}" stroke="${LN}" stroke-width="3" stroke-linecap="round"/>`,
  pad:(x1,x2,y,h=6)=>`<rect x="${x1}" y="${y}" width="${x2-x1}" height="${h}" rx="${h/2}" fill="${LN}" stroke="${MU}" stroke-opacity=".4"/>`,
  flat:(x1,x2,y)=>`<path d="M${x1+9} ${y+5}V${FL}M${x2-9} ${y+5}V${FL}M${x1+3} ${FL}h12M${x2-15} ${FL}h12" stroke="${MU}" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" fill="none"/>`+EQ.pad(x1,x2,y),
  seat:(x1,x2,y)=>`<path d="M${(x1+x2)/2} ${y+5}V${FL}M${(x1+x2)/2-9} ${FL}h18" stroke="${MU}" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" fill="none"/>`+EQ.pad(x1,x2,y),
  back:(p,q)=>padLine(p,q,7),
  tower:(x,top=4)=>`<rect x="${x}" y="${top}" width="9" height="${FL-top}" rx="2" fill="${LN}" stroke="${MU}" stroke-opacity=".4"/>`,
  pulley:(x,y)=>`<circle cx="${x}" cy="${y}" r="3.6" fill="${LN}" stroke="${MU}" stroke-width="1.6"/>`,
  /* coluna de pesos: as placas de cima sobem "lift" quando o cabo é puxado; devolve o desenho e o ponto onde o cabo prende */
  stack:(x,lift)=>{let s="";for(let i=0;i<4;i++)s+=`<rect x="${x}" y="${FL-6-i*4.5}" width="16" height="4" rx="1" fill="${MU}" opacity=".5"/>`;const y0=FL-6-4*4.5-lift;for(let i=0;i<3;i++)s+=`<rect x="${x}" y="${f1(y0-i*4.5)}" width="16" height="4" rx="1" fill="${MU}"/>`;s+=`<rect x="${x+7}" y="${f1(y0-9-5)}" width="2" height="15" fill="${MU}"/>`;return {s,top:[x+8,y0-14]};},
  cable:pts=>`<polyline points="${pts.map(p=>f1(p[0])+","+f1(p[1])).join(" ")}" fill="none" stroke="${MU}" stroke-width="1.4" stroke-linejoin="round"/>`
};
/* Vista lateral. Pose: hip, t (ângulo do tronco), hd (cabeça), F (direção do peito), foot/fb, foot2/fb2 (perna de trás),
   knee/knee2 (joelho explícito), hand/hb ou elb+fa (cotovelo fixo e ângulo do antebraço), hand2/hb2, ft (comprimento do pé) */
function jointsSide(P){
  const F=P.F||[1,0];
  const S=add(P.hip,dir(P.t),34);
  const nd=dir(P.t+(P.hd||0));
  const J={S,hip:P.hip,F,neck:add(S,nd,5),head:add(S,nd,13),ft:P.ft===undefined?9:P.ft};
  const res=h=>h?(h[0]==="r"?[S[0]+h[1],S[1]+h[2]]:h[0]==="hip"?[P.hip[0]+h[1],P.hip[1]+h[2]]:h):null;
  const leg=(Ft,b,K0)=>K0?[K0,Ft]:ik(P.hip,Ft,26,25,b);
  [J.K,J.A]=leg(P.foot,P.fb===undefined?-1:P.fb,P.knee);
  if(P.foot2)[J.K2,J.A2]=leg(P.foot2,P.fb2===undefined?-1:P.fb2,P.knee2);
  let T=res(P.hand);const EL=P.elb?res(P.elb):null;
  if(P.fa!==undefined&&EL)T=add(EL,dir(P.fa),17);
  [J.E,J.H]=EL?[EL,T]:ik(S,T,20,17,P.hb===undefined?1:P.hb);
  if(P.elb2&&P.fa2!==undefined){J.E2=res(P.elb2);J.H2=add(J.E2,dir(P.fa2),17);}
  else if(P.hand2)[J.E2,J.H2]=ik(S,res(P.hand2),20,17,P.hb2===undefined?1:P.hb2);
  return J;
}
function bodySide(P,J,f){
  const ink="var(--ink)",back="var(--muted)";
  const legS=(K,A,c)=>cap(P.hip,K,10,8,c)+cap(K,A,8,5.5,c)+cap(A,[A[0]+J.ft,A[1]+.5],5.5,4,c);
  const armS=(E,H,c)=>cap(J.S,E,7,5.5,c)+cap(E,H,5.5,4.2,c)+C(H,2.8,c);
  let s="";
  if(J.K2)s+=legS(J.K2,J.A2,back);
  if(J.H2)s+=armS(J.E2,J.H2,back)+weight(add(J.H2,f.wo2||f.wo||[0,0]),f.hold2||"",angOf(J.E2,J.H2));
  const fr=fnorm(P.hip,J.S,J.F),c1=add(mix(P.hip,J.S,.5),fr,2);     /* tronco com leve curvatura, peito aberto */
  s+=`<path d="M${f1(P.hip[0])} ${f1(P.hip[1])}Q${f1(c1[0])} ${f1(c1[1])} ${f1(J.S[0])} ${f1(J.S[1])}" stroke="${ink}" stroke-width="12.5" stroke-linecap="round" fill="none"/>`+C(P.hip,6.6,ink);
  s+=cap(J.S,J.neck,5.5,4.6,ink)+C(J.head,7.2,ink);
  s+=legS(J.K,J.A,ink)+armS(J.E,J.H,ink);
  return s;
}
/* Regiões musculares na vista lateral */
function muscSide(n,J){
  const {S,hip,F,E,H,K,A}=J;
  switch(n){
    case "peito":return blob(hip,S,.8,4.5,7,4,F);
    case "dorsal":return blob(hip,S,.55,-3.5,12,4,F);
    case "trapezio":return blob(hip,S,.98,-4,4,3,F);
    case "lombar":return blob(hip,S,.25,-4,7,3,F);
    case "core":return blob(hip,S,.42,4.5,9,3.2,F);
    case "ombro_ant":return ci(add(S,fnorm(hip,S,F),2.5),5.2);
    case "ombro_lat":return ci(S,5.6);
    case "ombro_post":return ci(add(S,fnorm(hip,S,F),-2.5),5.2);
    case "biceps":return blob(S,E,.5,2.6,7,3.2,F);
    case "triceps":return blob(S,E,.5,-2.6,7,3,F);
    case "antebraco":return blob(E,H,.4,0,6,2.8,F);
    case "gluteo":return ci(add(add(hip,fnorm(hip,S,F),-4.5),nrm(sub(K,hip)),3),6);
    case "quad":return blob(hip,K,.5,3,9,3.6,F);
    case "posterior":return blob(hip,K,.5,-3,9,3.6,F);
    case "pant":return blob(K,A,.4,-2.6,7,3,F);
  }
  return "";
}
/* Vista frontal. Pose: mode (stand, seat, bent, lie), sy (altura do ombro), hand [dx,y] relativo ao eixo, hb, ou arc (ângulo do braço) */
function jointsFront(P){
  const cx=80,sy=P.sy,mode=P.mode||"stand",sx=mode==="lie"?14:13;
  const J={cx,sy,mode,sx,hy:sy+34,Sh:[cx+sx,sy]};
  if(P.arc!==undefined){const a=P.arc*R,b=(P.arc-14)*R;J.E=[cx+sx+20*Math.sin(a),sy-20*Math.cos(a)];J.H=[J.E[0]+17*Math.sin(b),J.E[1]-17*Math.cos(b)];}
  else [J.E,J.H]=ik(J.Sh,[cx+P.hand[0],P.hand[1]],20,17,P.hb===undefined?1:P.hb);
  return J;
}
const mirX=(p,cx)=>[2*cx-p[0],p[1]];
function bodyFront(P,J){
  const ink="var(--ink)",{cx,sy,mode,hy}=J;let s="";
  if(mode==="lie"){
    s+=C([cx,sy-8],6.8,ink)+`<ellipse cx="${cx}" cy="${sy+2}" rx="17" ry="7" fill="${ink}"/>`;
  }else if(mode==="bent"){
    const h2=sy+8;
    s+=cap([cx-7,h2],[cx-9,FL-3],9,6.5,ink)+cap([cx+7,h2],[cx+9,FL-3],9,6.5,ink);
    s+=`<ellipse cx="${cx-9}" cy="${FL-1.5}" rx="5" ry="2.5" fill="${ink}"/><ellipse cx="${cx+9}" cy="${FL-1.5}" rx="5" ry="2.5" fill="${ink}"/>`;
    s+=`<rect x="${cx-15}" y="${sy-4}" width="30" height="13" rx="6.5" fill="${ink}"/>`+C([cx,sy+12],7.2,ink);
  }else{
    if(mode==="seat")s+=cap([cx-7,hy],[cx-11,hy+7],10,9,ink)+cap([cx+7,hy],[cx+11,hy+7],10,9,ink)+cap([cx-11,hy+7],[cx-12,FL-3],8,5.5,ink)+cap([cx+11,hy+7],[cx+12,FL-3],8,5.5,ink);
    else s+=cap([cx-7,hy],[cx-9,FL-3],9.5,6,ink)+cap([cx+7,hy],[cx+9,FL-3],9.5,6,ink);
    s+=`<ellipse cx="${cx-10}" cy="${FL-1.5}" rx="5.5" ry="2.5" fill="${ink}"/><ellipse cx="${cx+10}" cy="${FL-1.5}" rx="5.5" ry="2.5" fill="${ink}"/>`;
    s+=`<path d="M${cx-14} ${sy-2}L${cx+14} ${sy-2}L${cx+9} ${hy+2}L${cx-9} ${hy+2}Z" fill="${ink}" stroke="${ink}" stroke-width="5" stroke-linejoin="round"/>`;
    s+=cap([cx,sy-3],[cx,sy-9],5.5,4.6,ink)+C([cx,sy-15.5],7.2,ink);
  }
  for(const m of [1,-1]){
    const Sh=m>0?J.Sh:mirX(J.Sh,cx),E=m>0?J.E:mirX(J.E,cx),H=m>0?J.H:mirX(J.H,cx);
    s+=cap(Sh,E,7,5.5,ink)+cap(E,H,5.5,4.2,ink)+C(H,2.8,ink);
  }
  return s;
}
function muscFront(n,J){
  const {cx,sy,mode}=J,F=[0,-1],Sh=J.Sh,ShL=mirX(J.Sh,cx),EL=mirX(J.E,cx),HL=mirX(J.H,cx);
  const both=f=>f(1)+f(-1);
  switch(n){
    case "peito":return mode==="lie"?both(m=>ci([cx+m*7,sy],4.6)):both(m=>`<ellipse cx="${cx+m*6.5}" cy="${sy+7}" rx="6" ry="4.4" transform="rotate(${m*-12} ${cx+m*6.5} ${sy+7})"/>`);
    case "ombro_ant":case "ombro_lat":case "ombro_post":return both(m=>ci([cx+m*J.sx,sy+(mode==="bent"?-1:0)],5.5));

function absPose(P){

  if(writing){pending=true;return;}
  writing=true;
  try{await docRef.set(JSON.parse(JSON.stringify(state)));cloud=true;}catch(e){cloud=false;}
  writing=false;setSync();
  if(pending){pending=false;push();}
}
function setSync(){const el=$("#sync");if(el)el.textContent=cloud?"Salvo na sua conta":"Salvo neste aparelho";}

function sess(day){
  if(!state.session||state.session.day!==day)return null;
  return state.session;
}
/* Séries do treino em andamento, indexadas pelo uid do item (estável ao reordenar ou trocar outros itens) */
function setsOf(day,it){
  const s=sess(day);
  return (s&&s.sets[it.uid])||null;
}
function ensureSession(day){
  if(!state.session||state.session.day!==day){
    state.session={day,duid:DAYS[day-1].uid,prog:state.activeProgram,startedAt:Date.now(),sets:{}};
  }
  return state.session;
}
function item(day,i){return DAYS[day-1].items[i];}
function restOf(it){if(it.rest!=null)return it.rest;const r=state.rest[it.id];return r!=null?r:(it.m?150:75);}
function fmtT(sec){return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");}
function topReps(r){const m=String(r).match(/\d+/g);return m?Math.max(...m.map(Number)):null;}
function stepFor(id){const e=EX[id];if(!e)return 0;if(e.eq==="halter")return 2;return ["barra","maquina","polia","smith"].includes(e.eq)?5:0;}
function exProgress(day,it){
  const arr=(setsOf(day,it)||[]).slice(0,it.s);
  return arr.filter(x=>x&&x.done).length;
}

function render(){
  renderView();
  document.body.classList.toggle("hasbar",ui.tab==="montar"&&!!state.draft);
  document.body.classList.toggle("t-treino",ui.tab==="treino");
  paintMaps();
}
function renderView(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("sel",b.dataset.tab===ui.tab));
  if(ui.tab==="historico")return renderHistory();
  if(ui.tab==="montar")return renderBuilder();
  if(ui.tab==="inicio")return renderHome();
  if(ui.day==null)ui.day=nextDay();
  const day=ui.day,plan=DAYS[day-1],nd=nextDay();
  const total=plan.items.reduce((a,it)=>a+it.s,0);
  const done=plan.items.reduce((a,it)=>a+exProgress(day,it),0);
  const groups=groupsOf(plan.items);
  const mins=Math.max(5,Math.round(total*3.25/5)*5);
  const other=state.session&&state.session.day!==day;
  const exDone=plan.items.filter(it=>exProgress(day,it)>=it.s).length,cur=curItem(day);
  const C=2*Math.PI*40,frac=total?done/total:0;
  let h=`<header class="top"><h1 class="display">Meu treino</h1><div class="sync" id="sync"></div></header>
  <div class="days${DAYS.length>=7?" d7":""}" style="grid-template-columns:repeat(${DAYS.length},1fr)" role="tablist" aria-label="Dia do treino">${DAYS.map((d,i)=>`<button type="button" role="tab" aria-selected="${day===i+1}" class="day${day===i+1?" sel":""}" data-day="${i+1}"><span class="n">${i+1}</span><span class="t">${esc(d.extra)}</span>${nd===i+1&&day!==i+1?'<span class="next" title="Próximo treino"></span>':""}</button>`).join("")}</div>
  <section class="hero2">
   <div class="pring" role="img" aria-label="${done} de ${total} séries feitas"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/><circle id="pringc" cx="46" cy="46" r="40" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}" style="filter:drop-shadow(0 0 4px var(--accent));transition:stroke-dashoffset .3s"/></svg><span class="v"><span id="pringv">${done}/${total}</span><small>séries</small></span></div>
   <div style="min-width:0"><span class="kicker">${day===nd?(state.session?"Em andamento":"Próximo treino"):"Dia "+nd+" é o próximo"}</span><h2 class="display">${dayTitle(day,plan,groups)}</h2>
   <p><span id="exdone">${exDone} de ${plan.items.length}</span> exercícios · cerca de ${mins} min</p>
   ${cur?`<p>Agora: <b style="color:var(--ink)">${esc(exName(cur.id)||cur.id)}</b></p>`:plan.items.length?'<p style="color:var(--done)">Todos os exercícios feitos. Toque em Concluir treino.</p>':""}
   <div class="groups">${groups.map(g=>`<span class="chip"><b style="background:var(--${g})"></b>${G[g]}</span>`).join("")}</div></div></section>
  <div class="bar" role="progressbar" aria-label="Séries concluídas" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" style="margin-bottom:14px"><i style="width:${total?done/total*100:0}%"></i></div>
  <div class="list">${plan.items.map((it,i)=>cardHTML(day,it,i)).join("")}</div>
  ${plan.items.length?"":'<div class="bempty">'+EMPTY_SVG+'<b>Este dia está vazio</b>Toque em Adicionar exercício e escolha pelo músculo.</div>'}
  <button type="button" class="btn ghost addex" data-act="addex">+ Adicionar exercício a este dia</button>
  ${progMap(day,plan)}
  <div class="actions">
   <button class="btn" id="finish" type="button" ${done?"":"disabled"}>Concluir treino</button>
   ${sess(day)&&done?'<button class="btn ghost" id="reset" type="button">Descartar séries deste treino</button>':""}
   ${other?`<p class="hint">Você tem o Dia ${state.session.day} em andamento. Marcar séries aqui substitui aquele treino.</p>`:""}
  </div>`;
  $("#app").innerHTML=h;setSync();
}
/* Dia com vários grupos é "Full body"; o rótulo do dia vira o foco */
function dayTitle(day,plan,groups){
  const ex=String(plan.extra||"");
  if(groups.length>=3&&ex.length>1)return `Dia ${day} · Full body <small style="font-size:.5em;font-weight:700;color:var(--muted);letter-spacing:.02em">(foco: ${esc(ex)})</small>`;
  return `Dia ${day}${ex?" · "+esc(ex):""}`;
}
/* Mapa de progresso do treino: porções previstas em fundo fraco; acendem conforme cada exercício é concluído */
function progState(day,plan){
  const rank={"plan-s":1,"plan-p":2,"mid-s":3,"mid-p":4,"on-s":5,"on-p":6},st={};
  const put=(k,c)=>{if(!st[k]||rank[c]>rank[st[k]])st[k]=c;};
  plan.items.forEach(it=>{const e=EX[it.id],por=e&&e.por;if(!por)return;
    const n=exProgress(day,it),tag=n>=it.s?"on":n>0?"mid":"plan";
    (por.s||[]).forEach(k=>put(k,tag+"-s"));(por.p||[]).forEach(k=>put(k,tag+"-p"));});
  return st;
}
function progMap(day,plan){
  const st=progState(day,plan),ks=Object.keys(st);if(!ks.length)return "";
  const p=ks.filter(k=>/-p$/.test(st[k]));
  return `<section class="pmap" id="pmap"><h3 class="sec display">Músculos deste treino</h3>
  <p class="pleg"><span><i class="lg0"></i>previsto</span> · <span><i class="lg1"></i>em andamento</span> · <span><i class="lg2"></i>concluído</span></p>
  <figure class="mmap">${map3d(bestView(p.length?p:ks),[],[],[],false).replace(/class="bmap"/g,`class="bmap" data-st="${esc(ks.map(k=>k+":"+st[k]).join(","))}"`)}${viewSeg(bestView(p.length?p:ks))}${sexToggle()}</figure></section>`;
}
function updProg(day){
  const box=$("#pmap");if(!box)return;const st=progState(day,DAYS[day-1]);
  const v=Object.keys(st).map(k=>k+":"+st[k]).join(",");
  box.querySelectorAll(".bmap").forEach(m=>m.dataset.st=v);paintMaps(box);
}
function groupsOf(items){const set=new Set(items.map(it=>EX[it.id]&&EX[it.id].g).filter(Boolean));return Object.keys(G).filter(g=>set.has(g));}
/* Imagem do exercício: foto real, ilustração animada ou, sem nenhuma das duas, um marcador neutro (nunca ícone quebrado) */
function thumbHTML(id){
  if(PH.has(id))return phHTML(id,0);
  if(FIG[id])return `<svg class="fig" data-fig="${id}" viewBox="0 0 160 136" aria-hidden="true">${figSVG(id,KPEAK)}</svg>`;
  const g=catOf(id)||"core";
  return `<svg class="noimg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12" fill="none" stroke="var(--${g},var(--muted))" stroke-width="2" stroke-linecap="round"/></svg>`;
}
function bigHTML(id,e){
  if(PH.has(id))return `<div class="big">${phHTML(id,1,e.n)}</div>`;
  if(FIG[id])return `<div class="big fig1"><svg class="fig" data-fig="${id}" viewBox="0 0 160 136" role="img" aria-label="Animação do exercício ${esc(e.n)}">${figSVG(id,KPEAK)}</svg></div>`;
  return "";
}
/* Exercício atual = primeiro que ainda tem série por fazer; ui.open undefined abre ele automaticamente */
function curItem(day){return DAYS[day-1].items.find(it=>exProgress(day,it)<it.s)||null;}
function openKey(day){if(ui.open!==undefined)return ui.open;const c=curItem(day);return c?c.uid:null;}
const EMPTY_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M8 10l4 1 4-1M10 21l2-6 2 6"/></svg>';

  const after=nextK==null?null:(nextK<it.s-1?`série ${nextK+2} de ${esc(e.n)}`:(nextIt&&nextIt.uid!==key?esc(exName(nextIt.id)||nextIt.id):"fim do treino"));
  return `<article class="ex${cls}${open?" open":""}${isCur?" cur":""}" data-key="${key}" data-i="${i}">

    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>

/* Porções ativadas (primárias e secundárias), equipamento, mapa muscular e fonte */
function porNames(a){return (a||[]).map(k=>PORC[k]?PORC[k][1]:k).join(", ");}
const mvTag=e=>e&&MVN[e.mv]?`<span class="mvt mv-${e.mv}" title="Padrão de movimento">${MVN[e.mv].toUpperCase()}</span>`:"";
function muscHTML(e){
  const m=e.por||{p:[],s:[]};
  let h=e.eq||e.mv?`<div class="mrow">${e.eq?`<span class="chip">${esc(EQN[e.eq]||e.eq)}</span>`:""}${mvTag(e)}</div>`:"";
  h+=muscleMap(m);
  if(e.ref)h+=`<p class="ref">Fonte: ${esc(e.ref)}</p>`;
  return h;
}
function progHint(day,it){
  const arr=(setsOf(day,it)||[]).slice(0,it.s);const done=arr.filter(x=>x&&x.done);
  if(done.length<it.s)return "";
  const top=topReps(it.r);if(!top)return "";
  if(!done.every(x=>(x.r||0)>=top))return "";
  const step=stepFor(it.id),w=state.weights[it.id];
  if(!step||w==null)return `<p class="prog">Você fez ${top} ou mais em todas as séries. Na próxima, tente mais uma repetição ou uma variação mais difícil.</p>`;
  return `<p class="prog">Você fez ${top} ou mais em todas as séries. Na próxima, suba para <b>${w+step} kg</b>.</p>`;
}
/* ===== Seletor de exercício (folha sobre a tela): filtro por categoria, porção e busca =====
   ui.pk = {mode:"add"|"swap"|"badd", day, uid, di, cat, por, q} */
function openPicker(o){
  const cur=o.uid&&DAYS[o.day-1]?DAYS[o.day-1].items.find(x=>x.uid===o.uid):null;
  const cat=cur?catOf(cur.id):"";
  ui.pk={cat,por:"",mv:"",q:"",prev:null,added:[],...o};
  ui.pk.view=cat?bestView(Object.keys(PORC).filter(k=>PORC[k][0]===cat)):"front";
  renderSheet();
}
const grpPorcs=g=>Object.keys(PORC).filter(k=>PORC[k][0]===g);
function pickerIds(){
  const pk=ui.pk,q=normTxt(pk.q||"");
  const ids=Object.keys(EX).filter(id=>{const e=EX[id];
    if(pk.cat&&e.g!==pk.cat&&!(e.por&&[...e.por.p,...e.por.s].some(k=>PORC[k]&&PORC[k][0]===pk.cat)))return false;
    if(pk.mv&&e.mv!==pk.mv)return false;
    if(pk.por&&!(e.por&&(e.por.p.includes(pk.por)||e.por.s.includes(pk.por))))return false;
    if(q&&!normTxt(e.n+" "+(EQN[e.eq]||e.eq||"")+" "+porNames([...(e.por?e.por.p:[]),...(e.por?e.por.s:[])])).includes(q))return false;return true;});
  /* primário da porção (ou do grupo) primeiro */
  const prim=id=>{const e=EX[id],p=e.por?e.por.p:[];return pk.por?p.includes(pk.por):pk.cat?(e.g===pk.cat||p.some(k=>PORC[k]&&PORC[k][0]===pk.cat)):true;};
  ids.sort((a,b)=>(prim(b)?1:0)-(prim(a)?1:0));
  return ids;
}
/* ids já no dia em edição (para marcar "no treino") */

function countTxt(){const n=pickerIds().length,pk=ui.pk;return `${n} ${n===1?"exercício":"exercícios"}${pk.mv?" · "+MVN[pk.mv]:""}${pk.por?" · "+esc(PORC[pk.por][1]):pk.cat?" · "+G[pk.cat]:""}`;}

      if(a==="data-b"||a==="data-act"){const c=el.closest&&el.closest(".ex");if(c)q=`.ex[data-key="${c.dataset.key}"] `+q;else if(el.dataset.di!==undefined)q+=`[data-di="${el.dataset.di}"]`;}

    return;
  }

  const prevFocus=!fresh&&el.contains(document.activeElement)?focusSel(document.activeElement):null;

function trapTab(ev){
  const el=$("#sheet");if(!el||ev.key!=="Tab")return;
  const f=[...el.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')].filter(n=>!n.disabled&&n.getClientRects().length);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1],a=document.activeElement;
  if(!el.contains(a)){ev.preventDefault();first.focus();}
  else if(ev.shiftKey&&(a===first||a.tagName==="H3")){ev.preventDefault();last.focus();}
  else if(!ev.shiftKey&&a===last){ev.preventDefault();first.focus();}
}

}

function barsSVG(vals,labels,fmt,label,goal){

  if(goal)g+=`<line x1="${left}" y1="${ys(goal).toFixed(1)}" x2="${W-left}" y2="${ys(goal).toFixed(1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-left}" y="${(ys(goal)-4).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--muted)">meta ${goal}</text>`;
  const iMax=vals.indexOf(Math.max(...vals));

    g+=`<rect x="${(left+i*bw).toFixed(1)}" y="${top}" width="${bw.toFixed(1)}" height="${H-bot-top}" fill="transparent"><title>${esc(labels[i])}: ${esc(fmt(v))}</title></rect>`;

/* Aceita o envelope { app, version, state } ou o state cru do localStorage, vindo de arquivo ou de texto colado. Lança erro com mensagem em pt-BR. */
function parseBackup(text){
  const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
  /* Descreve o que foi encontrado, para o usuário saber o que colou/selecionou */
  const descr=v=>{
    if(v===null)return "valor nulo";
    if(Array.isArray(v))return "uma lista com "+v.length+" "+(v.length===1?"item":"itens")+", não um objeto";
    if(typeof v==="string")return "um texto ("+(v.length>40?v.slice(0,40)+"…":v)+")";
    if(typeof v==="number"||typeof v==="boolean")return "um "+(typeof v==="number"?"número":"valor lógico")+" ("+String(v)+")";
    if(isObj(v)){const k=Object.keys(v);return k.length?"um objeto sem os campos esperados. Chaves encontradas: "+k.slice(0,8).join(", ")+(k.length>8?"…":""):"um objeto vazio";}
    return "um valor do tipo "+typeof v;
  };
  let t=String(text==null?"":text).replace(/^\uFEFF/,"").trim();
  /* Colado do console ou de um app de notas: '{"weights":...}' entre aspas simples */
  if(t.length>1&&t[0]==="'"&&t[t.length-1]==="'")t=t.slice(1,-1).trim();
  if(!t)throw new Error("O conteúdo está vazio.");
  let data;
  try{data=JSON.parse(t);}catch(e){throw new Error("O conteúdo não é um JSON válido: "+(e&&e.message?e.message:"erro de sintaxe")+".");}
  /* JSON codificado duas vezes (ex.: copiado do console ou do Notas do iPhone) vira uma string; tenta de novo até 2 vezes */
  for(let i=0;i<2&&typeof data==="string";i++){
    const inner=data.replace(/^\uFEFF/,"").trim();
    try{data=JSON.parse(inner);}catch(e){break;}
  }
  if(!isObj(data))throw new Error("O conteúdo não tem o formato de backup do Meu treino: é "+descr(data)+".");
  /* Versões anteriores do app exportavam o envelope com "estado" e um espelho em pt-BR no nível de cima (cargas, historico, ...) */
  const toMs=v=>{if(typeof v==="number")return v;if(typeof v==="string"){const n=Date.parse(v);if(!isNaN(n))return n;const m=+v;if(!isNaN(m))return m;}return 0;};
  const PT={cargas:"weights",historico:"history",descansos:"rest",trocas:"swaps",sessaoEmAndamento:"session",programas:"programs",programaAtivo:"activeProgram",ultimasReps:"lastReps"};
  const hasPT=o=>isObj(o)&&("cargas" in o||"historico" in o);
  const fromPT=o=>{const r={};for(const k in PT)if(o[k]!==undefined)r[PT[k]]=o[k];if(o.atualizadoEm!==undefined)r.updatedAt=toMs(o.atualizadoEm);return r;};
  const hasEN=o=>isObj(o)&&("history" in o||"weights" in o||"programs" in o);
  const nomes=isObj(data.nomes)?data.nomes:null;
  let s=data;
  if("app" in data||"state" in data||"estado" in data){
    if(data.app!==undefined&&data.app!=="meu-treino")throw new Error("Este backup é de outro aplicativo ("+String(data.app)+").");
    s=data.state!==undefined?data.state:data.estado;
    if(typeof s==="string"){try{s=JSON.parse(s);}catch(e){}}
    if(!hasEN(s)&&hasPT(data))s=fromPT(data);
    if(!isObj(s))throw new Error("O campo \"state\" do backup não é um objeto: é "+descr(s)+".");
  }else if(!hasEN(data)&&hasPT(data))s=fromPT(data);
  if(!("history" in s)&&!("weights" in s)&&!("programs" in s)){
    const k=Object.keys(s);
    throw new Error("O conteúdo não tem os dados esperados (histórico, cargas ou programas)."+(k.length?" Chaves encontradas: "+k.slice(0,8).join(", ")+(k.length>8?"…":"")+".":" O objeto está vazio."));
  }
  if(s.history!==undefined&&!Array.isArray(s.history))throw new Error("O histórico do backup está em formato inválido.");
  if(s.programs!==undefined&&!Array.isArray(s.programs))throw new Error("Os programas do backup estão em formato inválido.");
  if(s.weights!==undefined&&!isObj(s.weights))throw new Error("As cargas do backup estão em formato inválido.");
  const copy=JSON.parse(JSON.stringify(s));
  const num=(v,d)=>{const n=typeof v==="string"?parseFloat(v):v;return Number.isFinite(n)?n:d;};
  /* Normaliza cada treino do histórico para o render nunca depender de campo ausente (formatos antigos não têm prog, label, min...) */
  copy.history=(copy.history||[]).filter(x=>isObj(x)&&Array.isArray(x.ex)).map(x=>{
    const ex=x.ex.filter(e=>isObj(e)&&e.id!=null&&e.id!=="").map(e=>{
      const sets=(Array.isArray(e.sets)?e.sets:[]).filter(isObj).map(y=>({...y,w:num(y.w,0),r:num(y.r,0)}));
      const r={...e,id:String(e.id),sets};
      if(!EX[r.id]&&!r.n&&nomes&&nomes[r.id])r.n=String(nomes[r.id]);
      return r;
    });
    const nsets=ex.reduce((a,e)=>a+e.sets.length,0);
    const vol=ex.reduce((a,e)=>a+e.sets.reduce((b,y)=>b+(y.w||0)*(num(y.r,0)||0),0),0);
    const r={...x,date:toMs(x.date),day:Math.max(1,Math.round(num(x.day,1))),prog:x.prog||"fullbody6",sets:num(x.sets,nsets),vol:num(x.vol,vol),min:num(x.min,0),ex};
    delete r.kcal;
    return r;
  });
  for(const k of ["weights","lastReps"]){
    if(!isObj(copy[k])){delete copy[k];continue;}
    for(const id of Object.keys(copy[k])){const n=num(copy[k][id],NaN);if(Number.isFinite(n))copy[k][id]=n;else delete copy[k][id];}
  }
  copy.programs=(copy.programs||[]).filter(x=>isObj(x)&&x.id&&Array.isArray(x.days));
  delete copy.profile;delete copy.food;delete copy.recentFoods;
  if(!(isObj(copy.session)&&isObj(copy.session.sets)&&Number.isFinite(num(copy.session.day,NaN))))copy.session=null;
  if(copy.updatedAt!==undefined)copy.updatedAt=toMs(copy.updatedAt);
  return copy;
}

/* Giro do mapa por arrasto (mouse e toque): rotateY contínuo, leve rotateX, inércia e encaixe na face mais próxima.

let b3g=null,b3block=0;

function b3paint(c){

    const l=c.parentNode.querySelector(".b3l");if(l)l.style.opacity=(sh*.9).toFixed(3);});

function b3snap(c){

function b3end(ev){

    if(Math.abs(v)>.4)c._inr=requestAnimationFrame(step);else{c._inr=0;b3snap(c);}};

  if(t.id==="homestart"){ui.tab="treino";ui.day=nextDay();ui.open=undefined;render();scrollTo(0,0);return;}
  if(t.dataset.hx){ui.homeEx=t.dataset.hx;render();return;}
  if(t.id==="bkexp"){exportBackup();return;}
  if(t.id==="bkimp"){const f=$("#impfile");f.value="";f.click();return;}
  if(t.id==="bkundo"){undoImport();return;}
  if(t.id==="bkcopy"){copyBackup();return;}
  if(t.id==="bkpaste"){if(ui.bkpaste&&$("#bkpastebox")&&!$("#bkpastebox").hidden)closePasteBox();else openPasteBox();return;}
  if(t.id==="bkpastecancel"){closePasteBox();return;}
  if(t.id==="bkpasteok"){const ta=$("#bktext");if(!ta)return;if(importBackupText(ta.value))closePasteBox();else ta.focus();return;}
  if(t.dataset.tab){ui.tab=t.dataset.tab;render();scrollTo(0,0);return;}
  if(t.dataset.day){ui.day=+t.dataset.day;ui.open=undefined;ui.menu=null;render();return;}
  if(t.id==="finish")return finish();
  if(t.id==="reset"){state.session=null;save();render();return;}
  if(t.dataset.act==="addex"){openPicker({mode:"add",day:ui.day});return;}
  const card=t.closest(".ex");if(!card)return;
  const key=card.dataset.key,day=ui.day,items=DAYS[day-1].items,i=items.findIndex(x=>x.uid===key),it=items[i];if(!it)return;
  const redraw=()=>{const y=scrollY;render();scrollTo(0,y);};
  if(t.dataset.act==="toggle"){ui.open=openKey(day)===key?null:key;rerenderCard(card,day,it,i);return;}
  if(t.dataset.act==="menu"){ui.menu=ui.menu===key?null:key;rerenderCard(card,day,it,i);const b=document.querySelector(`.ex[data-key="${key}"] [data-act="menu"]`);if(b)b.focus({preventScroll:true});return;}
  if(t.dataset.act==="rest"){it.rest=Math.max(15,Math.min(600,restOf(it)+(+t.dataset.d)));save();rerenderCard(card,day,it,i);return;}
  if(t.dataset.act==="swap"){openPicker({mode:"swap",day,uid:key});return;}
  /* Edição direta do treino ativo: séries, ordem, peso, remoção (o histórico não é tocado) */
  if(t.dataset.act==="sets"){it.s=Math.max(1,Math.min(10,it.s+(+t.dataset.d)));const s=sess(day);if(s&&s.sets[key])s.sets[key]=s.sets[key].slice(0,it.s);save();rerenderCard(card,day,it,i);updateTop(day);return;}
  if(t.dataset.act==="heavy"){it.m=!it.m;save();rerenderCard(card,day,it,i);return;}
  if(t.dataset.act==="mv"){const j=i+(+t.dataset.d);if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];save();redraw();
    const c=document.querySelector(`.ex[data-key="${key}"] [data-act="mv"][data-d="${t.dataset.d}"]`)||document.querySelector(`.ex[data-key="${key}"] .exh`);if(c){c.focus({preventScroll:true});c.scrollIntoView({block:"center",behavior:"smooth"});}return;}
  if(t.dataset.act==="rmex"){if(!armed("rmex:"+key)){rerenderCard(card,day,it,i);return;}
    items.splice(i,1);const s=sess(day);if(s)delete s.sets[key];if(ui.open===key)ui.open=undefined;ui.menu=null;save();redraw();toast("Exercício removido do treino");return;}
  if(t.dataset.act==="done"||t.dataset.act==="log"){
    let row=t.closest(".set");
    if(t.dataset.act==="log"){const arr0=setsOf(day,it)||[];const k0=[...Array(it.s).keys()].find(k=>!(arr0[k]&&arr0[k].done));row=card.querySelector(`.set[data-k="${k0}"]`);if(!row)return;}
    const k=+row.dataset.k;
    const s=ensureSession(day);const arr=s.sets[key]||(s.sets[key]=[]);
    const cur=arr[k]||{};
    const wIn=row.querySelector('[data-f="w"]').value.replace(",","."),rIn=row.querySelector('[data-f="r"]').value;
    cur.w=wIn===""?null:+wIn;cur.r=rIn===""?+minReps(it.r)||null:+rIn;
    cur.done=!cur.done;arr[k]=cur;
    if(cur.done){
      if(cur.w!=null&&!isNaN(cur.w))state.weights[it.id]=cur.w;
      if(cur.r!=null&&!isNaN(cur.r))state.lastReps[it.id]=cur.r;
      const left=arr.slice(0,it.s).filter(x=>x&&x.done).length;
      const nx=left<it.s?"série "+(left+1)+" de "+exName(it.id):(()=>{const c=curItem(day);return c?exName(c.id)||c.id:"concluir o treino";})();
      startTimer(restOf(it),nx);keepAwake();askNotify();
      if(left>=it.s){ui.open=undefined;ui.menu=null;save();redraw();const c=curItem(day);
        toast(c?"Exercício concluído · próximo: "+(exName(c.id)||c.id):"Todos os exercícios feitos!");
        const el=c&&document.querySelector(`.ex[data-key="${c.uid}"]`);if(el)el.scrollIntoView({block:"start",behavior:RM?"auto":"smooth"});return;}
    }
    save();rerenderCard(card,day,it,i);updateTop(day);
  }
});
/* Cliques dentro da folha (seletor de exercício e formulário do personalizado) */
function sheetClick(t){
  const d=t.dataset;
  if(d.sh==="close"){closeSheet();return;}
  if(d.sh==="newcx"){ui.pk.prev=null;ui.cx={id:null,n:ui.pk&&ui.pk.q||"",eq:"maquina",g:ui.pk&&ui.pk.cat||"peito",por:{p:[],s:[]},obs:"",back:true};renderSheet();return;}
  if(d.sh==="cxsave"){saveCx();return;}
  if(d.sh==="back"){ui.pk.prev=null;renderSheet();return;}
  if(d.pkm!==undefined){ui.pk.mv=d.pkm;renderSheet(true);return;}
  if(d.pkc!==undefined){ui.pk.cat=d.pkc;ui.pk.por="";if(d.pkc)ui.pk.view=bestView(grpPorcs(d.pkc));lsSet(LS_TIP,"1");renderSheet(true);return;}
  if(d.pksx){const a=ui.pk.sx||(ui.pk.sx=[]),i=a.indexOf(d.pksx);if(i>=0)a.splice(i,1);else a.push(d.pksx);
    const l=$("#pklist");if(l)l.innerHTML=pickerList();const b=document.querySelector(`#sheet [data-pksx="${d.pksx}"]`);if(b)b.focus({preventScroll:true});return;}
  if(d.pkp!==undefined){lsSet(LS_TIP,"1");ui.pk.por=d.pkp;if(d.pkp&&!porcsIn(ui.pk.view||"front").has(d.pkp))ui.pk.view=bestView([d.pkp]);renderSheet(true);return;}
  if(d.pkid){ui.pk.prev=d.pkid;renderSheet();return;}
  if(d.pkadd){pickChosen(d.pkadd);return;}
  if(d.cxp){readCxForm();const c=ui.cx,k=d.cxp;
    if(c.por.p.includes(k)){c.por.p=c.por.p.filter(x=>x!==k);c.por.s.push(k);}
    else if(c.por.s.includes(k))c.por.s=c.por.s.filter(x=>x!==k);
    else c.por.p.push(k);
    renderSheet(true);
    const b=document.querySelector(`#sheet [data-cxp="${k}"]`);if(b)b.focus({preventScroll:true});return;}
}

  trapTab(ev);

document.addEventListener("input",ev=>{
  const inp=ev.target;

  if(inp.dataset&&inp.dataset.bf&&state.draft){

    else if(f==="kg"){const v=inp.value.replace(",",".").trim(),n=+v;if(v==="")delete state.weights[inp.dataset.id];else if(isFinite(n)&&n>=0)state.weights[inp.dataset.id]=n;}

  }

  const v=inp.value.replace(",",".").trim(),num=v===""?null:+v,ok=num!=null&&isFinite(num)&&num>=0;

  if(s){const arr=s.sets[key]||(s.sets[key]=[]);const cur=arr[k]||(arr[k]={w:null,r:null,done:false});
    if(v===""||ok)cur[f]=num;}

});
document.addEventListener("change",ev=>{
  const inp=ev.target;

function rerenderCard(el,day,it,i){
  const tmp=document.createElement("div");tmp.innerHTML=cardHTML(day,it,i);const n=tmp.firstElementChild;el.replaceWith(n);paintMaps(n);
}
function updateTop(day){
  const plan=DAYS[day-1];const total=plan.items.reduce((a,it)=>a+it.s,0);
  const done=plan.items.reduce((a,it)=>a+exProgress(day,it),0);
  const bar=document.querySelector(".bar i");if(bar)bar.style.width=(total?done/total*100:0)+"%";
  const bb=document.querySelector(".bar[role=progressbar]");if(bb){bb.setAttribute("aria-valuenow",done);bb.setAttribute("aria-valuemax",total);}
  const pr=document.querySelector(".pring");if(pr)pr.setAttribute("aria-label",`${done} de ${total} séries feitas`);
  const pv=$("#pringv");if(pv)pv.textContent=done+"/"+total;
  const pc=$("#pringc");if(pc){const C=2*Math.PI*40;pc.setAttribute("stroke-dashoffset",(C*(1-(total?done/total:0))).toFixed(1));}
  const ed=$("#exdone");if(ed)ed.textContent=plan.items.filter(it=>exProgress(day,it)>=it.s).length+" de "+plan.items.length;
  const f=$("#finish");if(f)f.disabled=!done;
  updProg(day);
  if(!$("#reset")&&done){const a=document.querySelector(".actions");if(a&&f){f.insertAdjacentHTML("afterend",'<button class="btn ghost" id="reset" type="button">Descartar séries deste treino</button>');}}
}
/* Registro no histórico: snapshot do nome, categoria e séries feitas, com referência ao id do exercício e ao uid do item */
function finish(){
  const s=state.session;if(!s)return;
  const plan=DAYS[s.day-1];let n=0,vol=0;const ex=[];
  plan.items.forEach(it=>{
    const arr=(s.sets[it.uid]||[]).slice(0,it.s).filter(x=>x&&x.done);
    if(!arr.length)return;
    arr.forEach(x=>{n++;vol+=(x.w||0)*(x.r||0);});
    const e=EX[it.id];
    ex.push({id:it.id,uid:it.uid,n:e?e.n:it.id,g:e?e.g:"",sets:arr.map(x=>({w:x.w,r:x.r}))});
    const z=arr[arr.length-1];if(z.w!=null&&isFinite(z.w))state.weights[it.id]=z.w;if(z.r!=null&&isFinite(z.r))state.lastReps[it.id]=z.r;
  });
  if(!n)return;
  const p=findProg(state.activeProgram);
  const entry={hid:newUid("h"),date:Date.now(),day:s.day,prog:state.activeProgram,pn:p?p.name:"",label:plan.extra,sets:n,vol,min:Math.max(1,Math.round((Date.now()-s.startedAt)/60000)),ex};
  state.history.unshift(entry);
  state.session=null;ui.day=null;ui.open=undefined;stopTimer();releaseAwake();
  save();render();scrollTo(0,0);toast(`Treino concluído: ${n} séries`);
}
let tEnd=0,tInt=null,tDur=1;
function startTimer(sec,next){
  tEnd=Date.now()+sec*1000;tDur=sec*1000;$("#tl").textContent="Próximo: "+next;$("#tlive").textContent="";
  const t=$("#timer");t.classList.add("on");t.classList.remove("end");

}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $("#tt").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  const tb=$("#tbar");if(tb)tb.style.width=Math.min(100,Math.max(0,(1-(tEnd-Date.now())/tDur)*100))+"%";
  if(left===0){clearInterval(tInt);const t=$("#timer");t.classList.add("end");$("#tl").textContent="Hora da próxima série";$("#tlive").textContent="Descanso terminou";
    try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
    beep();notifyEnd();
    setTimeout(()=>{if(Date.now()>=tEnd)stopTimer();},6000);}
}
