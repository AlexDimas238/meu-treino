/* ===== Atualização automática =====
   O app aberto pela tela de início fica suspenso e o Pages guarda cache. Ao abrir, ao voltar a ficar visível e no
   pageshow vindo do cache, compara version.json com APP_VERSION. Se mudou, salva e recarrega com cache-busting.
   Não recarrega com descanso rodando ou campo em edição: mostra um aviso com botão. */
const APP_VERSION="20261112194948";
let verLast=0,verNew=null;
function busy(){
  const t=$("#timer");if(t&&t.classList.contains("on")&&!t.classList.contains("end"))return true;
  const a=document.activeElement;return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"||a.isContentEditable));
}
function goVersion(v){
  try{const k="verTry",o=JSON.parse(sessionStorage.getItem(k)||"null");
    if(o&&o.v===v&&Date.now()-o.t<300000)return false;   /* já tentou há menos de 5 min: cache da CDN */
    sessionStorage.setItem(k,JSON.stringify({v,t:Date.now()}));}catch(e){}
  try{save();}catch(e){}
  location.replace(location.pathname+"?v="+encodeURIComponent(v));return true;
}
function verBar(v){
  let b=$("#verbar");
  if(!b){b=document.createElement("div");b.id="verbar";b.className="toast on";b.setAttribute("role","status");
    b.innerHTML='Nova versão disponível · <button type="button" style="border:0;background:rgba(255,255,255,.25);color:inherit;font-weight:700;border-radius:8px;padding:4px 10px;margin-left:6px">Atualizar</button>';
    b.querySelector("button").onclick=()=>{try{sessionStorage.removeItem("verTry");}catch(e){}goVersion(verNew||v);};
    document.body.appendChild(b);}
}
async function checkVersion(force){
  if(!force&&Date.now()-verLast<60000)return;verLast=Date.now();
  try{
    if(navigator.onLine===false)return;
    const ac=window.AbortController?new AbortController():null,tm=setTimeout(()=>ac&&ac.abort(),6000);
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store",signal:ac?ac.signal:undefined});clearTimeout(tm);if(!r.ok)return;
    const v=String((await r.json()).v||"");if(!v||v===APP_VERSION)return;
    verNew=v;
    await refreshCache();                                  /* baixa a versão nova para o cache antes de recarregar */
    if(busy()){verBar(v);return;}
    goVersion(v);
  }catch(e){}                                            /* offline ou erro: ignora */
}
/* ===== Offline: service worker (sw.js) guarda o app e as fotos; dados ficam no localStorage =====
   Ao achar versão nova, pede ao service worker para atualizar o cache em segundo plano e espera no máximo 12 s;
   qualquer falha é silenciosa e o app continua com o que já está no aparelho. */
let swReg=null;
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("sw.js").then(r=>{swReg=r;}).catch(()=>{});
}
function refreshCache(){
  return new Promise(res=>{
    const sw=navigator.serviceWorker&&navigator.serviceWorker.controller;
    if(!sw){res();return;}
    const done=()=>{clearTimeout(to);navigator.serviceWorker.removeEventListener("message",onMsg);res();};
    const onMsg=e=>{if(e.data&&e.data.type==="refreshed")done();};
    const to=setTimeout(done,12000);
    navigator.serviceWorker.addEventListener("message",onMsg);
    try{sw.postMessage({type:"refresh"});}catch(e){done();}
    try{swReg&&swReg.update().catch(()=>{});}catch(e){}
  });
}
checkVersion(true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkVersion();});
addEventListener("online",()=>checkVersion(true));
addEventListener("pageshow",e=>{if(e.persisted)checkVersion();});

const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Só o card aberto anima (miniaturas e demais cards ficam na pose de pico, igual ao modo de movimento reduzido);
   cerca de 30 quadros por segundo bastam e poupam bateria */
let figT0=performance.now(),figLast=0;
function figLoop(now){
  requestAnimationFrame(figLoop);
  if(now-figLast<33)return;figLast=now;
  const k=((now-figT0)/CYCLE_MS)%1;
  document.querySelectorAll(".ex.open svg.fig").forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.bottom<0||r.top>innerHeight)return;
    el.innerHTML=figSVG(el.dataset.fig,k);
  });
}
if(!RM)requestAnimationFrame(figLoop);

(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u)return;
    const uid=await u.id();if(!uid)return;
    db=d;docRef=db.doc("data/users/"+uid+"/treino");

        normState();applyProgram();
        ui.day=null;render();
      }else if((state.updatedAt||0)>(remote.updatedAt||0)){push();}
      cloud=true;
    }else{await push();}
    setSync();
  }catch(e){setSync();}
})();
